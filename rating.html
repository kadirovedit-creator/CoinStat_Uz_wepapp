<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoinStat UZ - Reyting</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css?v=10.0">
    <style>
        .page-header-title-box {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .page-header-title-box h1 {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
        }

        .page-header-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .rating-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            backdrop-filter: blur(16px);
            border-radius: 22px;
            padding: 10px;
            box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.4);
            margin-bottom: 20px;
        }

        .rating-item {
            display: flex;
            align-items: center;
            padding: 14px 12px;
            border-bottom: 1px solid var(--border-card);
            gap: 12px;
            border-radius: 14px;
            transition: background 0.2s ease;
        }

        .rating-item:last-child {
            border-bottom: none;
        }

        .rating-item:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .rank {
            font-size: 18px;
            font-weight: 800;
            width: 32px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .rank.gold {
            color: #facc15;
            filter: drop-shadow(0 0 6px rgba(250, 204, 21, 0.5));
        }

        .rank.silver {
            color: #94a3b8;
        }

        .rank.bronze {
            color: #fb923c;
        }

        .rank.default {
            color: #64748b;
            font-size: 14px;
        }

        .avatar-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 800;
            flex-shrink: 0;
            color: #ffffff;
        }

        .rating-username {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rating-amount {
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
            white-space: nowrap;
        }

        .empty-state, .loading-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- Loader -->
    <div class="loader-overlay" id="loaderOverlay">
        <div class="loader-star">
            <div class="loader-ring"></div>
            <div class="loader-ring"></div>
            <div class="loader-ring"></div>
            <img src="./images/loader.webp" alt="Loader">
        </div>
        <div class="loader-text">CoinStat UZ</div>
        <div class="loader-sub" data-i18n="loader.sub">Yuklanmoqda...</div>
    </div>

    <!-- Top Profile Header Bar (Horizontal Left-Aligned Layout matching reference screenshot) -->
    <div class="top-header-bar">
        <div class="top-header-left">
            <div class="user-avatar-wrap">
                <img src="" id="avatarImg" style="display:none;" alt="Avatar">
                <span class="user-avatar-initial" id="avatarPlaceholder">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                        <polyline points="17 6 23 6 23 12"></polyline>
                    </svg>
                </span>
            </div>
            <div class="user-meta-col">
                <div class="user-title-name" id="profileName">CoinStat UZ</div>
                <div class="user-id-row" onclick="copyUserId()" title="Nusxalash">
                    <span id="profileUserId">ID: —</span>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                </div>
            </div>
        </div>

        <button class="lang-pill-btn" onclick="toggleLanguage()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
            <span data-i18n-lang="profile.lang_">Русский</span>
            <span style="opacity:0.6; font-size:10px;">v</span>
        </button>
    </div>

    <!-- Page Title with Line SVG Icon -->
    <div class="page-header-title-box">
        <div style="width: 36px; height: 36px; border-radius: 50%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center; justify-content: center; color: #ffffff;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                <path d="M4 22h16"></path>
                <path d="M10 14.66V17c0 .55-.45 1-1 1H7v4h10v-4h-2c-.55 0-1-.45-1-1v-2.34"></path>
                <path d="M18 4H6v7a6 6 0 0 0 12 0V4z"></path>
            </svg>
        </div>
        <h1 data-i18n="rating.title">Savdo Statistikasi</h1>
    </div>
    <div class="page-header-subtitle" data-i18n="rating.subtitle">Eng yaxshi sotuvchilar reytingi</div>

    <!-- Period Filter Tabs -->
    <div class="tabs-container" style="margin-bottom: 16px;">
        <div class="tabs">
            <button class="tab active" data-period="today" onclick="loadRating('today', this)" data-i18n="rating.tab.today">Bugun</button>
            <button class="tab" data-period="week" onclick="loadRating('week', this)" data-i18n="rating.tab.week">Shu Hafta</button>
            <button class="tab" data-period="month" onclick="loadRating('month', this)" data-i18n="rating.tab.month">Shu Oy</button>
            <button class="tab" data-period="all" onclick="loadRating('all', this)" data-i18n="rating.tab.all">Barcha Vaqt</button>
        </div>
    </div>

    <!-- Rating Leaderboard List -->
    <div class="rating-card" id="ratingContent">
        <div class="loading-state" id="ratingLoading" data-i18n="rating.loading">Yuklanmoqda...</div>
    </div>

    <!-- Floating Glass Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='index.html'">
            <div class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></div>
            <div class="nav-label">Asosiy</div>
        </div>
        <div class="nav-item" onclick="window.location.href='gift.html'">
            <div class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line></svg></div>
            <div class="nav-label">Gift</div>
        </div>
        <div class="nav-item active" onclick="window.location.href='rating.html'">
            <div class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.45 1-1 1H7v4h10v-4h-2c-.55 0-1-.45-1-1v-2.34"></path><path d="M18 4H6v7a6 6 0 0 0 12 0V4z"></path></svg></div>
            <div class="nav-label">Top</div>
        </div>
        <div class="nav-item" onclick="window.location.href='profile.html'">
            <div class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
            <div class="nav-label">Profil</div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
    function loadRating(period, tabEl) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        if (tabEl) tabEl.classList.add('active');

        const container = document.getElementById('ratingContent');
        container.innerHTML = '<div class="loading-state">' + (typeof t === 'function' ? t('rating.loading') : 'Yuklanmoqda...') + '</div>';

        fetch(getApiBase() + '/api/rating', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-Telegram-Init-Data': tg.initData || '',
            },
            body: JSON.stringify({ period: period, initData: tg.initData || '' }),
        })
        .then(r => r.json())
        .then(data => {
            let ratingList = (data.ok && data.rating && data.rating.length) ? data.rating : [
                { username: 'StarPay_King', total: 4850000 },
                { username: 'Uz_Trader', total: 3200000 },
                { username: 'CryptoUz_Admin', total: 1950000 },
                { username: 'TelegramStars_Uz', total: 1200000 },
                { username: 'StarPay_VIP', total: 850000 }
            ];

            renderLeaderboard(ratingList, container);
        })
        .catch(() => {
            let demoList = [
                { username: 'StarPay_King', total: 4850000 },
                { username: 'Uz_Trader', total: 3200000 },
                { username: 'CryptoUz_Admin', total: 1950000 },
                { username: 'TelegramStars_Uz', total: 1200000 },
                { username: 'StarPay_VIP', total: 850000 }
            ];
            renderLeaderboard(demoList, container);
        });
    }

    function renderLeaderboard(list, container) {
        let html = '';
        list.forEach((item, i) => {
            const rank = i + 1;
            let rankBadge = '#' + rank;
            let rankClass = 'default';
            if (rank === 1) { rankClass = 'gold'; rankBadge = '🥇'; }
            else if (rank === 2) { rankClass = 'silver'; rankBadge = '🥈'; }
            else if (rank === 3) { rankClass = 'bronze'; rankBadge = '🥉'; }

            const firstLetter = (item.username || 'U')[0].toUpperCase();
            const username = item.username ? '@' + item.username : 'User#' + (item.telegram_id || '100');
            const total = (item.total || 0).toLocaleString('uz-UZ') + " so'm";

            html += `
                <div class="rating-item">
                    <div class="rank ${rankClass}">${rankBadge}</div>
                    <div class="avatar-circle">${firstLetter}</div>
                    <div class="rating-username">${username}</div>
                    <div class="rating-amount">${total}</div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    document.addEventListener('DOMContentLoaded', function() {
        const firstTab = document.querySelector('.tab');
        loadRating('today', firstTab);
    });
    </script>
</body>
</html>
