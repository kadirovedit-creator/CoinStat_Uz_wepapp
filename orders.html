<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoinStat UZ - Buyurtmalar</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>window.API_BASE = 'https://test-uz-r78q.onrender.com';</script>
    <link rel="stylesheet" href="css/style.css?v=10.0">
    <style>
        .orders-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 16px;
            padding-bottom: 120px;
            width: 100%;
        }

        /* Top Header Navigation */
        .orders-header-bar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .orders-back-btn, .orders-refresh-btn {
            width: 40px;
            height: 40px;
            border-radius: 14px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .orders-back-btn:active, .orders-refresh-btn:active {
            transform: scale(0.92);
            background: rgba(56, 189, 248, 0.15);
        }

        .orders-header-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 3-Column Stats Grid Banner */
        .orders-stats-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 16px 10px;
            margin-bottom: 18px;
            box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.4);
        }

        .stat-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            position: relative;
        }

        .stat-col:not(:last-child)::after {
            content: '';
            position: absolute;
            right: 0;
            top: 20%;
            height: 60%;
            width: 1px;
            background: var(--border-card);
        }

        .stat-col-val {
            font-size: 17px;
            font-weight: 800;
            color: var(--accent-sky);
        }

        .stat-col-lbl {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* Main View Switcher Tabs */
        .view-switch-tabs {
            width: 100%;
            display: flex;
            background: rgba(13, 19, 34, 0.8);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 4px;
            margin-bottom: 16px;
            gap: 4px;
        }

        .view-tab-btn {
            flex: 1;
            padding: 10px 0;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .view-tab-btn.active {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
        }

        /* Scrollable Category & Status Filter Pills */
        .filter-pills-row {
            width: 100%;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 12px;
            scrollbar-width: none;
        }

        .filter-pills-row::-webkit-scrollbar {
            display: none;
        }

        .filter-pill {
            padding: 7px 14px;
            border-radius: 999px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .filter-pill.active {
            background: rgba(56, 189, 248, 0.15);
            border-color: rgba(56, 189, 248, 0.5);
            color: var(--accent-sky);
        }

        /* Order Cards List */
        .orders-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .order-card {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            backdrop-filter: blur(16px);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
        }

        .order-card:active {
            transform: scale(0.99);
        }

        .order-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .order-product-icon-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .product-icon-box {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .order-title-box {
            display: flex;
            flex-direction: column;
        }

        .order-product-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
        }

        .order-id-sub {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-badge.completed, .status-badge.paid {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .status-badge.pending, .status-badge.processing {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .status-badge.failed, .status-badge.cancelled {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .order-card-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .order-info-col {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .order-info-label {
            font-size: 11px;
            color: var(--text-muted);
        }

        .order-info-val {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
        }

        .order-price-val {
            font-size: 16px;
            font-weight: 800;
            color: var(--accent-sky);
        }

        .order-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 8px;
            border-top: 1px dashed rgba(255, 255, 255, 0.08);
            font-size: 12px;
        }

        .order-date-text {
            color: var(--text-sub);
            font-size: 11px;
        }

        .order-action-btns {
            display: flex;
            gap: 6px;
        }

        .order-mini-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .order-mini-btn:active {
            background: rgba(56, 189, 248, 0.2);
            color: var(--accent-sky);
        }

        /* Empty state */
        .empty-orders-card {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            padding: 32px 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
        }

        .empty-icon-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-sky);
            margin-bottom: 4px;
        }

        /* Balance History List */
        .balance-item-card {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .balance-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .balance-item-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .balance-item-icon.plus {
            background: rgba(34, 197, 94, 0.12);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .balance-item-icon.minus {
            background: rgba(239, 68, 68, 0.12);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .balance-item-desc {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-main);
        }

        .balance-item-date {
            font-size: 11px;
            color: var(--text-muted);
        }

        .balance-item-amount {
            font-size: 15px;
            font-weight: 800;
        }

        .balance-item-amount.plus {
            color: #22c55e;
        }

        .balance-item-amount.minus {
            color: #ef4444;
        }
    </style>
</head>

<body>

    <!-- Loader Overlay -->
    <div class="loader-overlay" id="loaderOverlay">
        <div class="loader-star">
            <div class="loader-ring"></div>
            <div class="loader-ring"></div>
            <div class="loader-ring"></div>
            <img src="./images/loader.webp" alt="Loader">
        </div>
        <div class="loader-text">CoinStat UZ</div>
        <div class="loader-sub">Buyurtmalar yuklanmoqda...</div>
    </div>

    <div class="orders-container">

        <!-- Top Header Navigation Bar -->
        <div class="orders-header-bar">
            <button class="orders-back-btn" onclick="goBack()" title="Orqaga">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>

            <div class="orders-header-title">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent-sky)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span>Buyurtmalar tarixi</span>
            </div>

            <button class="orders-refresh-btn" onclick="fetchTransactions()" title="Yangilash">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"></polyline>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                </svg>
            </button>
        </div>

        <!-- 3-Column Summary Stats Banner -->
        <div class="orders-stats-grid">
            <div class="stat-col">
                <div class="stat-col-val" id="statTotalOrders">0</div>
                <div class="stat-col-lbl">Jami buyurtma</div>
            </div>
            <div class="stat-col">
                <div class="stat-col-val" id="statCompletedOrders" style="color:#22c55e;">0</div>
                <div class="stat-col-lbl">Bajarilgan</div>
            </div>
            <div class="stat-col">
                <div class="stat-col-val" id="statTotalSpent">0 so'm</div>
                <div class="stat-col-lbl">Sarflangan</div>
            </div>
        </div>

        <!-- View Switcher Tabs (Buyurtmalar vs Balans Tarixi) -->
        <div class="view-switch-tabs">
            <button class="view-tab-btn active" id="tabOrdersBtn" onclick="switchViewTab('orders')">
                <span>📦</span>
                <span>Buyurtmalar</span>
            </button>
            <button class="view-tab-btn" id="tabBalanceBtn" onclick="switchViewTab('balance')">
                <span>💳</span>
                <span>Balans tarixi</span>
            </button>
        </div>

        <!-- Category Filters -->
        <div class="filter-pills-row" id="categoryFilterRow">
            <button class="filter-pill active" onclick="filterCategory('all', this)">📋 Barchasi</button>
            <button class="filter-pill" onclick="filterCategory('stars', this)">⭐ Stars</button>
            <button class="filter-pill" onclick="filterCategory('premium', this)">💎 Premium</button>
            <button class="filter-pill" onclick="filterCategory('gift', this)">🎁 Gift</button>
            <button class="filter-pill" onclick="filterCategory('phone', this)">📱 Telefon</button>
            <button class="filter-pill" onclick="filterCategory('topup', this)">💰 Balans</button>
        </div>

        <!-- Status Filters -->
        <div class="filter-pills-row" id="statusFilterRow">
            <button class="filter-pill active" onclick="filterStatus('all', this)">Barchasi</button>
            <button class="filter-pill" onclick="filterStatus('completed', this)">✅ Bajarilgan</button>
            <button class="filter-pill" onclick="filterStatus('pending', this)">⏳ Kutilmoqda</button>
            <button class="filter-pill" onclick="filterStatus('failed', this)">❌ Bekor qilingan</button>
        </div>

        <!-- Main Orders List Container -->
        <div class="orders-list" id="ordersListContainer">
            <!-- Dynamic content injected via JS -->
        </div>

        <!-- Balance History Container (Hidden by default) -->
        <div class="orders-list" id="balanceListContainer" style="display:none;">
            <!-- Dynamic content injected via JS -->
        </div>

    </div>

    <!-- Order Detail Modal -->
    <div class="custom-modal-overlay" id="orderModalOverlay">
        <div class="custom-modal-box" style="text-align: left; max-width: 380px;">
            <div class="modal-header-row" style="display:flex; align-items:center; justify-content:space-between; margin-bottom: 14px;">
                <div class="modal-title" style="display:flex; align-items:center; gap:8px; font-size:16px; font-weight:800; color:#ffffff;">
                    <span>📜 Buyurtma Tafsiloti</span>
                </div>
                <button class="modal-close-btn" onclick="closeOrderModal()" style="background:none; border:none; color:var(--text-sub); font-size:18px; cursor:pointer;">✕</button>
            </div>

            <div id="orderModalContent" style="display:flex; flex-direction:column; gap:10px; margin-bottom:16px;">
                <!-- Content injected via JS -->
            </div>

            <div style="display:flex; gap:8px;">
                <button class="btn-secondary" style="flex:1; padding:12px; border-radius:12px; font-weight:700;" onclick="copyCurrentOrderId()">
                    📋 ID Nusxalash
                </button>
                <button class="btn-primary" style="flex:1; padding:12px; border-radius:12px; font-weight:700; background:linear-gradient(135deg, #0284c7, #0369a1);" onclick="contactSupportForOrder()">
                    💬 Qo'llab-quvvatlash
                </button>
            </div>
        </div>
    </div>

    <!-- Floating Glass Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="openHome()">
            <div class="nav-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            </div>
            <div class="nav-label">Asosiy</div>
        </div>

        <div class="nav-item" onclick="openGifts()">
            <div class="nav-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line></svg>
            </div>
            <div class="nav-label">Gift</div>
        </div>

        <div class="nav-item active" onclick="openOrdersPage()">
            <div class="nav-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            </div>
            <div class="nav-label">Buyurtmalar</div>
        </div>

        <div class="nav-item" onclick="openProfile()">
            <div class="nav-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
            <div class="nav-label">Profil</div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
        let rawOrdersData = [];
        let rawBalanceData = [];
        let currentCategory = 'all';
        let currentStatus = 'all';
        let activeTab = 'orders';
        let selectedOrder = null;

        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'profile.html';
            }
        }

        function openHome() { window.location.href = 'index.html'; }
        function openGifts() { window.location.href = 'gift.html'; }
        function openOrdersPage() { window.location.href = 'orders.html'; }
        function openProfile() { window.location.href = 'profile.html'; }

        function switchViewTab(tab) {
            activeTab = tab;
            document.getElementById('tabOrdersBtn').classList.toggle('active', tab === 'orders');
            document.getElementById('tabBalanceBtn').classList.toggle('active', tab === 'balance');

            const catRow = document.getElementById('categoryFilterRow');
            const statRow = document.getElementById('statusFilterRow');
            const ordersCont = document.getElementById('ordersListContainer');
            const balCont = document.getElementById('balanceListContainer');

            if (tab === 'orders') {
                catRow.style.display = 'flex';
                statRow.style.display = 'flex';
                ordersCont.style.display = 'flex';
                balCont.style.display = 'none';
                renderOrders();
            } else {
                catRow.style.display = 'none';
                statRow.style.display = 'none';
                ordersCont.style.display = 'none';
                balCont.style.display = 'flex';
                renderBalanceHistory();
            }
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            if (btn) {
                document.querySelectorAll('#categoryFilterRow .filter-pill').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            renderOrders();
        }

        function filterStatus(stat, btn) {
            currentStatus = stat;
            if (btn) {
                document.querySelectorAll('#statusFilterRow .filter-pill').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
            renderOrders();
        }

        function fetchTransactions() {
            const userId = getUserId();
            if (!userId) {
                showEmptyOrders("Foydalanuvchi ma'lumotlari topilmadi. Qaytadan kiring.");
                return;
            }

            showLoader('Buyurtmalar yuklanmoqda...');

            fetch(getApiBase() + '/api/user/transactions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Telegram-Init-Data': tg.initData || '',
                },
                body: JSON.stringify({ telegram_id: userId, initData: tg.initData || '' }),
            })
            .then(r => r.json())
            .then(data => {
                hideLoader();
                if (data.ok) {
                    rawOrdersData = data.orders || [];
                    rawBalanceData = data.balance_history || [];
                    updateStatsGrid();
                    renderOrders();
                    renderBalanceHistory();
                } else {
                    showEmptyOrders(data.error || "Buyurtmalarni yuklashda xatolik");
                }
            })
            .catch(err => {
                hideLoader();
                showEmptyOrders("Tarmoqda xatolik yuz berdi");
            });
        }

        function updateStatsGrid() {
            const totalOrders = rawOrdersData.length;
            const completedOrders = rawOrdersData.filter(o => o.status === 'completed' || o.status === 'paid').length;
            let totalSpent = 0;
            rawOrdersData.forEach(o => {
                if (o.status === 'completed' || o.status === 'paid') {
                    totalSpent += (o.amount || 0);
                }
            });

            document.getElementById('statTotalOrders').textContent = totalOrders;
            document.getElementById('statCompletedOrders').textContent = completedOrders;
            document.getElementById('statTotalSpent').textContent = totalSpent > 0 ? totalSpent.toLocaleString('uz-UZ') + " so'm" : "0 so'm";
        }

        function getProductMeta(type) {
            switch(type) {
                case 'stars':
                    return { icon: '⭐', name: 'Telegram Stars', color: '#f59e0b' };
                case 'premium':
                    return { icon: '💎', name: 'Telegram Premium', color: '#0284c7' };
                case 'gift':
                    return { icon: '🎁', name: 'Telegram Gift', color: '#ec4899' };
                case 'phone':
                    return { icon: '📱', name: 'Virtual Nomer', color: '#8b5cf6' };
                case 'topup':
                    return { icon: '💰', name: "Hisobni to'ldirish", color: '#22c55e' };
                default:
                    return { icon: '📦', name: 'Xizmat', color: '#38bdf8' };
            }
        }

        function getStatusMeta(status) {
            switch(status) {
                case 'completed':
                case 'paid':
                    return { label: '✅ Bajarildi', class: 'completed' };
                case 'pending':
                case 'processing':
                    return { label: '⏳ Kutilmoqda', class: 'pending' };
                case 'failed':
                case 'cancelled':
                    return { label: '❌ Bekor qilindi', class: 'failed' };
                default:
                    return { label: status, class: 'pending' };
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return dateStr.slice(0, 16);
                const day = String(d.getDate()).padStart(2, '0');
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const year = d.getFullYear();
                const hours = String(d.getHours()).padStart(2, '0');
                const mins = String(d.getMinutes()).padStart(2, '0');
                return `${day}.${month}.${year} ${hours}:${mins}`;
            } catch(e) {
                return dateStr;
            }
        }

        function renderOrders() {
            const container = document.getElementById('ordersListContainer');
            if (!container) return;

            let filtered = rawOrdersData.filter(o => {
                if (o.product_type === 'topup' || o.product_type === 'balance') return false;
                if (o.status === 'cancelled' || o.status === 'failed') return false;
                return true;
            });

            if (currentCategory !== 'all') {
                filtered = filtered.filter(o => o.product_type === currentCategory);
            }

            if (currentStatus !== 'all') {
                if (currentStatus === 'completed') {
                    filtered = filtered.filter(o => o.status === 'completed' || o.status === 'paid');
                } else if (currentStatus === 'pending') {
                    filtered = filtered.filter(o => o.status === 'pending' || o.status === 'processing');
                } else if (currentStatus === 'failed') {
                    filtered = filtered.filter(o => o.status === 'failed' || o.status === 'cancelled');
                }
            }

            if (filtered.length === 0) {
                showEmptyOrders("Hozircha buyurtmalar mavjud emas.");
                return;
            }

            let html = '';
            filtered.forEach((o, index) => {
                const meta = getProductMeta(o.product_type);
                const st = getStatusMeta(o.status);
                const amt = (o.amount || 0).toLocaleString('uz-UZ');
                const dt = formatDate(o.created_at);
                const qtyText = o.quantity ? ` (${o.quantity} ta)` : '';
                const targetText = o.target_username ? `@${o.target_username.replace('@', '')}` : 'O\'zimga';

                html += `
                    <div class="order-card" onclick="openOrderDetail(${o.id})">
                        <div class="order-card-header">
                            <div class="order-product-icon-wrap">
                                <div class="product-icon-box">${meta.icon}</div>
                                <div class="order-title-box">
                                    <div class="order-product-name">${meta.name}${qtyText}</div>
                                    <div class="order-id-sub">Buyurtma ID: #${o.id}</div>
                                </div>
                            </div>
                            <div class="status-badge ${st.class}">${st.label}</div>
                        </div>

                        <div class="order-card-body">
                            <div class="order-info-col">
                                <span class="order-info-label">Qabul qiluvchi:</span>
                                <span class="order-info-val">${targetText}</span>
                            </div>
                            <div class="order-info-col" style="text-align:right;">
                                <span class="order-info-label">Summa:</span>
                                <span class="order-price-val">${amt} so'm</span>
                            </div>
                        </div>

                        <div class="order-card-footer">
                            <span class="order-date-text">📅 ${dt}</span>
                            <div class="order-action-btns">
                                <button class="order-mini-btn" onclick="event.stopPropagation(); copyOrderIdText(${o.id})">📋 Nusxa</button>
                                <button class="order-mini-btn" onclick="event.stopPropagation(); openOrderDetail(${o.id})">Batafsil ›</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function renderBalanceHistory() {
            const container = document.getElementById('balanceListContainer');
            if (!container) return;

            if (rawBalanceData.length === 0) {
                container.innerHTML = `
                    <div class="empty-orders-card">
                        <div class="empty-icon-circle">💳</div>
                        <div style="font-size:16px; font-weight:700; color:#fff;">Balans tarixi mavjud emas</div>
                        <div style="font-size:12px; color:var(--text-muted);">Balansingizdagi barcha kirim va chiqimlar shu yerda ko'rinadi.</div>
                    </div>
                `;
                return;
            }

            let html = '';
            rawBalanceData.forEach(b => {
                const isPlus = (b.amount || 0) >= 0;
                const sign = isPlus ? '+' : '';
                const amtStr = sign + (b.amount || 0).toLocaleString('uz-UZ') + " so'm";
                const dt = formatDate(b.created_at);
                const desc = b.description || (isPlus ? "Balans to'ldirish" : "Xizmat uchun to'lov");

                html += `
                    <div class="balance-item-card">
                        <div class="balance-item-left">
                            <div class="balance-item-icon ${isPlus ? 'plus' : 'minus'}">
                                ${isPlus ? '⇣' : '⇡'}
                            </div>
                            <div>
                                <div class="balance-item-desc">${desc}</div>
                                <div class="balance-item-date">${dt}</div>
                            </div>
                        </div>
                        <div class="balance-item-amount ${isPlus ? 'plus' : 'minus'}">${amtStr}</div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function showEmptyOrders(msg) {
            const container = document.getElementById('ordersListContainer');
            if (!container) return;
            container.innerHTML = `
                <div class="empty-orders-card">
                    <div class="empty-icon-circle">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="8" y1="12" x2="16" y2="12"></line>
                        </svg>
                    </div>
                    <div style="font-size:16px; font-weight:800; color:#ffffff;">Hozircha buyurtmalar yo'q</div>
                    <div style="font-size:12px; color:var(--text-muted); max-width:260px; line-height:1.4;">${msg}</div>
                    <button class="btn-primary" style="padding:10px 20px; border-radius:12px; font-weight:700; margin-top:6px; background:linear-gradient(135deg, #0284c7, #0369a1);" onclick="window.location.href='index.html'">
                        🛍️ Xarid qilish
                    </button>
                </div>
            `;
        }

        function openOrderDetail(orderId) {
            const order = rawOrdersData.find(o => o.id === orderId);
            if (!order) return;
            selectedOrder = order;

            const meta = getProductMeta(order.product_type);
            const st = getStatusMeta(order.status);
            const amt = (order.amount || 0).toLocaleString('uz-UZ');
            const dt = formatDate(order.created_at);
            const targetText = order.target_username ? `@${order.target_username.replace('@', '')}` : 'O\'zimga';

            const modalContent = document.getElementById('orderModalContent');
            modalContent.innerHTML = `
                <div style="display:flex; align-items:center; gap:12px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); padding:12px; border-radius:14px;">
                    <div class="product-icon-box" style="width:48px; height:48px; font-size:24px;">${meta.icon}</div>
                    <div>
                        <div style="font-size:16px; font-weight:800; color:#fff;">${meta.name}</div>
                        <div style="font-size:12px; color:var(--text-muted);">Buyurtma ID: <b>#${order.id}</b></div>
                    </div>
                </div>

                <div style="display:flex; flex-direction:column; gap:8px; background:var(--bg-card); border:1px solid var(--border-card); padding:14px; border-radius:14px; font-size:13px;">
                    <div style="display:flex; justify-content:space-between;">
                        <span style="color:var(--text-muted);">Status:</span>
                        <span class="status-badge ${st.class}">${st.label}</span>
                    </div>
                    <div style="display:flex; justify-content:space-between;">
                        <span style="color:var(--text-muted);">Summa:</span>
                        <b style="color:var(--accent-sky); font-size:14px;">${amt} so'm</b>
                    </div>
                    <div style="display:flex; justify-content:space-between;">
                        <span style="color:var(--text-muted);">Miqdor:</span>
                        <b style="color:#fff;">${order.quantity || 1} ta</b>
                    </div>
                    <div style="display:flex; justify-content:space-between;">
                        <span style="color:var(--text-muted);">Qabul qiluvchi:</span>
                        <b style="color:#fff;">${targetText}</b>
                    </div>
                    <div style="display:flex; justify-content:space-between;">
                        <span style="color:var(--text-muted);">Sana va vaqt:</span>
                        <b style="color:#fff;">${dt}</b>
                    </div>
                    ${order.external_id ? `
                    <div style="display:flex; justify-content:space-between;">
                        <span style="color:var(--text-muted);">Tranzaksiya ID:</span>
                        <b style="color:#fff; font-size:11px;">${order.external_id}</b>
                    </div>` : ''}
                </div>
            `;

            document.getElementById('orderModalOverlay').classList.add('open');
        }

        function closeOrderModal() {
            document.getElementById('orderModalOverlay').classList.remove('open');
        }

        function copyOrderIdText(id) {
            navigator.clipboard.writeText(String(id));
            if (tg.showPopup) {
                tg.showPopup({ title: '✅ Nusxalandi', message: 'Buyurtma ID nusxalandi: #' + id, buttons: [{ type: 'ok' }] });
            } else {
                alert('Buyurtma ID nusxalandi: #' + id);
            }
        }

        function copyCurrentOrderId() {
            if (selectedOrder) {
                copyOrderIdText(selectedOrder.id);
            }
        }

        function contactSupportForOrder() {
            const oid = selectedOrder ? selectedOrder.id : '';
            const msg = encodeURIComponent(`Salom, men #${oid} sonli buyurtmam bo'yicha yordam so'ramoqchi edim.`);
            tg.openTelegramLink(`https://t.me/cofeature?text=${msg}`);
        }

        document.addEventListener('DOMContentLoaded', function() {
            fetchTransactions();
        });
    </script>
</body>

</html>
