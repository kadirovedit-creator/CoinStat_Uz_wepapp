<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoinStat UZ - Buyurtmalarim</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css?v=12.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            padding: 16px;
            padding-bottom: 110px;
            min-height: 100vh;
        }

        /* Top Bar */
        .orders-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 4px 0;
        }

        .back-pill-btn, .refresh-pill-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #141418;
            border: 1px solid #222228;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .back-pill-btn:active, .refresh-pill-btn:active {
            transform: scale(0.92);
        }

        .orders-page-title {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
        }

        /* 3-Column Stats Grid */
        .stats-tri-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 18px;
            width: 100%;
        }

        .stat-card-box {
            background: #121316;
            border: 1px solid #222328;
            border-radius: 20px;
            padding: 14px 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .stat-label-text {
            font-size: 11px;
            font-weight: 600;
            color: #71717a;
        }

        .stat-value-text {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
        }

        /* Filter Tabs */
        .filter-tabs-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 18px;
            scrollbar-width: none;
            padding-bottom: 4px;
        }

        .filter-tabs-bar::-webkit-scrollbar {
            display: none;
        }

        .filter-chip-btn {
            background: #141418;
            border: 1px solid #222228;
            color: #a1a1aa;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 999px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-chip-btn.active {
            background: #ffffff;
            color: #000000;
            font-weight: 800;
        }

        /* Orders List */
        .orders-list-wrap {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }

        .order-item-card {
            background: #141418;
            border: 1px solid #222228;
            border-radius: 20px;
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .order-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .order-type-title {
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
        }

        .order-status-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 999px;
        }

        .order-status-badge.completed, .order-status-badge.paid {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .order-status-badge.pending {
            background: rgba(234, 179, 8, 0.15);
            color: #facc15;
            border: 1px solid rgba(234, 179, 8, 0.3);
        }

        .order-status-badge.rejected, .order-status-badge.cancelled {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .order-card-body {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            color: #a1a1aa;
        }

        .order-amount-text {
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
        }

        .order-date-text {
            font-size: 11px;
            color: #71717a;
        }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: #71717a;
            font-size: 14px;
            font-weight: 600;
        }

        /* Bottom Minimal Dock Navigation */
        .bottom-dock-nav {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: rgba(18, 19, 22, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            backdrop-filter: blur(20px);
            z-index: 100;
        }

        .dock-tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            border-radius: 18px;
            color: #71717a;
            cursor: pointer;
        }

        .dock-tab-btn.active {
            color: #ffffff;
        }
    </style>
</head>

<body>

    <!-- Top Bar -->
    <div class="orders-top-bar">
        <div class="back-pill-btn" onclick="window.location.href='index.html'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </div>
        <div class="orders-page-title">Buyurtmalarim</div>
        <div class="refresh-pill-btn" onclick="fetchOrders()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"></polyline>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
        </div>
    </div>

    <!-- 3-Column Stats Grid -->
    <div class="stats-tri-grid">
        <div class="stat-card-box">
            <div class="stat-label-text">Jami</div>
            <div class="stat-value-text" id="statAll">0</div>
        </div>
        <div class="stat-card-box">
            <div class="stat-label-text">Bajarildi</div>
            <div class="stat-value-text" id="statDone" style="color: #4ade80;">0</div>
        </div>
        <div class="stat-card-box">
            <div class="stat-label-text">Kutilmoqda</div>
            <div class="stat-value-text" id="statPending" style="color: #facc15;">0</div>
        </div>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs-bar">
        <button class="filter-chip-btn active" onclick="filterOrders('all', this)">Barchasi</button>
        <button class="filter-chip-btn" onclick="filterOrders('stars', this)">Stars</button>
        <button class="filter-chip-btn" onclick="filterOrders('premium', this)">Premium</button>
        <button class="filter-chip-btn" onclick="filterOrders('gift', this)">Gift</button>
        <button class="filter-chip-btn" onclick="filterOrders('topup', this)">To'lovlar</button>
    </div>

    <!-- Orders List -->
    <div class="orders-list-wrap" id="ordersList">
        <div class="empty-state">Yuklanmoqda...</div>
    </div>

    <!-- Floating Minimal Dock Navigation -->
    <div class="bottom-dock-nav">
        <div class="dock-tab-btn" onclick="window.location.href='index.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Asosiy</span>
        </div>
        <div class="dock-tab-btn" onclick="window.location.href='gift.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line></svg>
            <span>Gift</span>
        </div>
        <div class="dock-tab-btn" onclick="window.location.href='rating.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.45 1-1 1H7v4h10v-4h-2c-.55 0-1-.45-1-1v-2.34"></path><path d="M18 4H6v7a6 6 0 0 0 12 0V4z"></path></svg>
            <span>Top</span>
        </div>
        <div class="dock-tab-btn" onclick="window.location.href='profile.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Profil</span>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
        let allOrders = [];

        async function fetchOrders() {
            const userId = getUserId();
            const apiBase = getApiBase();
            const container = document.getElementById('ordersList');

            if (!userId) {
                container.innerHTML = '<div class="empty-state">Foydalanuvchi aniqlanmadi</div>';
                return;
            }

            try {
                const res = await fetch((apiBase ? apiBase : '') + '/api/user/transactions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': tg.initData || '' },
                    body: JSON.stringify({ telegram_id: userId, initData: tg.initData || '' })
                });
                const data = await res.json();
                if (data && data.ok) {
                    allOrders = data.orders || [];
                    updateStats(allOrders);
                    renderOrders(allOrders);
                } else {
                    container.innerHTML = '<div class="empty-state">Buyurtmalar topilmadi</div>';
                }
            } catch (err) {
                container.innerHTML = '<div class="empty-state">Yuklashda xatolik yuz berdi</div>';
            }
        }

        function updateStats(orders) {
            document.getElementById('statAll').textContent = orders.length;
            document.getElementById('statDone').textContent = orders.filter(o => o.status === 'completed' || o.status === 'paid').length;
            document.getElementById('statPending').textContent = orders.filter(o => o.status === 'pending').length;
        }

        function filterOrders(type, btn) {
            document.querySelectorAll('.filter-chip-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            if (type === 'all') {
                renderOrders(allOrders);
            } else {
                const filtered = allOrders.filter(o => {
                    const ptype = (o.product_type || o.type || '').toLowerCase();
                    return ptype.includes(type);
                });
                renderOrders(filtered);
            }
        }

        function renderOrders(orders) {
            const container = document.getElementById('ordersList');
            if (!orders || orders.length === 0) {
                container.innerHTML = '<div class="empty-state">Hozircha hech qanday buyurtma yo\'q</div>';
                return;
            }

            let html = '';
            orders.forEach(o => {
                const st = (o.status || 'completed').toLowerCase();
                let stLabel = 'Bajarildi';
                let stClass = 'completed';
                if (st === 'pending') { stLabel = 'Kutilmoqda'; stClass = 'pending'; }
                else if (st === 'rejected' || st === 'cancelled') { stLabel = 'Bekor qilindi'; stClass = 'rejected'; }

                const typeTitle = o.product_type || o.type || 'Xarid';
                const amount = Number(o.amount || o.price || 0).toLocaleString('uz-UZ') + " UZS";
                const dateStr = o.created_at ? new Date(o.created_at).toLocaleString('uz-UZ') : 'Yaqinda';

                html += `
                    <div class="order-item-card">
                        <div class="order-card-header">
                            <div class="order-type-title">${typeTitle}</div>
                            <div class="order-status-badge ${stClass}">${stLabel}</div>
                        </div>
                        <div class="order-card-body">
                            <div class="order-date-text">${dateStr}</div>
                            <div class="order-amount-text">${amount}</div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', fetchOrders);
    </script>
</body>

</html>
