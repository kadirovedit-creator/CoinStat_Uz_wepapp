<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoinStat UZ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css?v=12.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            padding: 16px;
            padding-bottom: 110px;
            min-height: 100vh;
        }

        /* Top Header Bar */
        .top-user-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            padding: 4px 0;
        }

        .user-left-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #141418;
            border: 1px solid #222228;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .user-avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .user-names-col {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .user-display-name {
            font-size: 16px;
            font-weight: 800;
            color: #ffffff;
        }

        .user-handle-name {
            font-size: 13px;
            font-weight: 600;
            color: #71717a;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .lang-badge-pill {
            background: #141418;
            border: 1px solid #222228;
            color: #a1a1aa;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Hero Balance Card */
        .hero-balance-container {
            background: #121316;
            border: 1px solid #222328;
            border-radius: 26px;
            padding: 22px 20px;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }

        .hero-balance-amount {
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .hero-chart-graphic {
            width: 100%;
            height: 64px;
            margin: 10px 0 18px 0;
            position: relative;
        }

        .hero-chart-graphic svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .hero-topup-button {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 16px;
            padding: 14px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .hero-topup-button:active {
            transform: scale(0.98);
            background: #e4e4e7;
        }

        /* 3-Column Stats Grid */
        .stats-tri-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .stat-card-box {
            background: #121316;
            border: 1px solid #222328;
            border-radius: 20px;
            padding: 14px 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .stat-label-text {
            font-size: 11px;
            font-weight: 600;
            color: #71717a;
        }

        .stat-value-text {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
        }

        .stat-unit-text {
            font-size: 10px;
            font-weight: 700;
            color: #71717a;
        }

        /* 4 Services Grid (2x2) */
        .services-quad-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .service-quad-card {
            background: #121316;
            border: 1px solid #222328;
            border-radius: 22px;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
        }

        .service-quad-card:hover {
            border-color: #3f3f46;
            background: #18191e;
        }

        .service-quad-card:active {
            transform: scale(0.97);
        }

        .service-icon-wrap {
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .service-icon-wrap img {
            width: 38px;
            height: 38px;
            object-fit: contain;
        }

        .service-card-title {
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
        }

        /* Bottom Minimal Dock Navigation */
        .bottom-dock-nav {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: rgba(18, 19, 22, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            backdrop-filter: blur(20px);
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .dock-tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            border-radius: 18px;
            color: #71717a;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .dock-tab-btn.active {
            color: #ffffff;
        }

        .dock-tab-btn:active {
            transform: scale(0.9);
        }
    </style>
</head>

<body>

    <!-- User Header -->
    <div class="top-user-header">
        <div class="user-left-info">
            <div class="user-avatar-circle">
                <img src="./images/logo.png" id="avatarImg" alt="CoinStat">
            </div>
            <div class="user-names-col">
                <div class="user-display-name" id="profileName">username</div>
                <div class="user-handle-name" onclick="copyUserId()">
                    <span id="profileUserId">@coinuser</span>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                </div>
            </div>
        </div>
        <button class="lang-badge-pill" onclick="toggleLanguage()" id="langBtn">uz</button>
    </div>

    <!-- Hero Balance Card -->
    <div class="hero-balance-container">
        <div class="hero-balance-amount">
            <span id="balance">0</span> UZS
        </div>

        <!-- Ascending Growth Chart SVG -->
        <div class="hero-chart-graphic">
            <svg viewBox="0 0 300 60" fill="none">
                <path d="M5 45 L 80 40 L 140 48 L 190 28 L 290 8" stroke="#3f3f46" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
                <circle cx="80" cy="40" r="4" fill="#121316" stroke="#ffffff" stroke-width="2.5" />
                <circle cx="140" cy="48" r="4" fill="#121316" stroke="#ffffff" stroke-width="2.5" />
                <circle cx="190" cy="28" r="4" fill="#121316" stroke="#ffffff" stroke-width="2.5" />
                <polyline points="275 8, 290 8, 290 23" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </div>

        <button type="button" class="hero-topup-button" onclick="window.location.href='topup.html'">
            <span>+ To'ldirish</span>
        </button>
    </div>

    <!-- 3-Column Stats Grid -->
    <div class="stats-tri-grid">
        <div class="stat-card-box" onclick="window.location.href='orders.html'" style="cursor: pointer;">
            <div class="stat-label-text">Buyurtmalar</div>
            <div class="stat-value-text" id="ordersCount">0</div>
        </div>
        <div class="stat-card-box">
            <div class="stat-label-text">Sarflangan</div>
            <div class="stat-value-text" id="totalSpent">0</div>
            <div class="stat-unit-text">UZS</div>
        </div>
        <div class="stat-card-box">
            <div class="stat-label-text">Balans</div>
            <div class="stat-value-text" id="userBalanceStat">0</div>
            <div class="stat-unit-text">UZS</div>
        </div>
    </div>

    <!-- 4 Services Grid (2x2) -->
    <div class="services-quad-grid">
        <!-- Stars -->
        <div class="service-quad-card" onclick="window.location.href='stars.html'">
            <div class="service-icon-wrap">
                <img src="./images/star.webp" alt="Stars">
            </div>
            <div class="service-card-title">Stars</div>
        </div>

        <!-- Premium -->
        <div class="service-quad-card" onclick="window.location.href='premium.html'">
            <div class="service-icon-wrap">
                <img src="./images/premium.webp" alt="Premium">
            </div>
            <div class="service-card-title">Premium</div>
        </div>

        <!-- Sovg'alar -->
        <div class="service-quad-card" onclick="window.location.href='gift.html'">
            <div class="service-icon-wrap">
                <img src="./images/gift.webp" alt="Sovg'alar">
            </div>
            <div class="service-card-title">Sovg'alar</div>
        </div>

        <!-- Virtual Nomer -->
        <div class="service-quad-card" onclick="window.location.href='phone.html'">
            <div class="service-icon-wrap">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                    <line x1="12" y1="18" x2="12.01" y2="18"></line>
                </svg>
            </div>
            <div class="service-card-title">Virtual Nomer</div>
        </div>
    </div>

    <!-- Floating Minimal Dock Navigation -->
    <div class="bottom-dock-nav">
        <div class="dock-tab-btn active" onclick="window.location.href='index.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Asosiy</span>
        </div>
        <div class="dock-tab-btn" onclick="window.location.href='gift.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line></svg>
            <span>Gift</span>
        </div>
        <div class="dock-tab-btn" onclick="window.location.href='rating.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.45 1-1 1H7v4h10v-4h-2c-.55 0-1-.45-1-1v-2.34"></path><path d="M18 4H6v7a6 6 0 0 0 12 0V4z"></path></svg>
            <span>Top</span>
        </div>
        <div class="dock-tab-btn" onclick="window.location.href='profile.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Profil</span>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadUserBalance();
            fetchTransactions();
        });

        async function fetchTransactions() {
            const userId = getUserId();
            const apiBase = getApiBase();
            if (!userId) return;

            try {
                const res = await fetch((apiBase ? apiBase : '') + '/api/user/transactions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': tg.initData || '' },
                    body: JSON.stringify({ telegram_id: userId, initData: tg.initData || '' })
                });
                const data = await res.json();
                if (data && data.ok) {
                    const cnt = document.getElementById('ordersCount');
                    const spent = document.getElementById('totalSpent');

                    // Filter only real purchase orders (exclude topup and deposits)
                    const purchaseOrders = (data.orders || []).filter(o => 
                        o.product_type !== 'topup' && 
                        o.product_type !== 'deposit' && 
                        o.product_type !== 'balance' &&
                        o.status !== 'cancelled' &&
                        o.status !== 'failed' &&
                        o.status !== 'rejected'
                    );

                    const ordersCount = (typeof data.orders_count === 'number') ? data.orders_count : purchaseOrders.length;
                    if (cnt) cnt.textContent = String(ordersCount);

                    let totalSpent = 0;
                    if (typeof data.total_spent === 'number') {
                        totalSpent = data.total_spent;
                    } else {
                        purchaseOrders.forEach(o => {
                            if (o.status === 'completed' || o.status === 'paid') {
                                totalSpent += Number(o.amount || 0);
                            }
                        });
                    }

                    if (spent) {
                        if (totalSpent >= 1000000) {
                            spent.textContent = (totalSpent / 1000000).toFixed(1) + 'M';
                        } else if (totalSpent >= 1000) {
                            spent.textContent = (totalSpent / 1000).toFixed(0) + 'k';
                        } else {
                            spent.textContent = totalSpent.toLocaleString('uz-UZ');
                        }
                    }
                }
            } catch (e) {}
        }
    </script>
</body>

</html>
