<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoinStat UZ - Top Reyting</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css?v=12.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            padding: 16px;
            padding-bottom: 130px;
            min-height: 100vh;
        }

        /* Top Brand Header */
        .rating-top-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 6px;
            padding-top: 4px;
        }

        .rating-top-brand img {
            width: 22px;
            height: 22px;
            object-fit: cover;
            border-radius: 50%;
        }

        .rating-top-brand span {
            font-size: 15px;
            font-weight: 800;
            color: #a1a1aa;
            letter-spacing: -0.3px;
        }

        .rating-page-title {
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 18px;
        }

        /* Period Tabs */
        .period-tabs-bar {
            display: flex;
            background: #141418;
            border: 1px solid #222228;
            border-radius: 999px;
            padding: 4px;
            margin-bottom: 20px;
            justify-content: space-between;
            gap: 4px;
        }

        .period-tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #71717a;
            font-size: 12px;
            font-weight: 700;
            padding: 9px 4px;
            border-radius: 999px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .period-tab-btn.active {
            background: #ffffff;
            color: #000000;
            font-weight: 800;
            box-shadow: 0 2px 10px rgba(255, 255, 255, 0.15);
        }

        /* Top 3 Podium Box */
        .podium-box-container {
            background: #121316;
            border: 1px solid #222328;
            border-radius: 26px;
            padding: 20px 14px 16px 14px;
            margin-bottom: 18px;
        }

        .podium-box-header {
            text-align: center;
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .podium-cylinders-row {
            display: grid;
            grid-template-columns: 1fr 1.15fr 1fr;
            align-items: end;
            gap: 8px;
            min-height: 190px;
        }

        .podium-column {
            background: #18191e;
            border: 1px solid #282932;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 14px 6px 12px 6px;
            text-align: center;
            position: relative;
            transition: all 0.2s ease;
        }

        /* 1st Place (Center - Gold) */
        .podium-column.first {
            min-height: 190px;
            background: linear-gradient(180deg, rgba(245, 158, 11, 0.15) 0%, #16171d 60%, #121316 100%);
            border: 1px solid rgba(245, 158, 11, 0.4);
            box-shadow: 0 8px 24px rgba(245, 158, 11, 0.12);
        }

        /* 2nd Place (Left - Silver) */
        .podium-column.second {
            min-height: 165px;
            background: linear-gradient(180deg, rgba(203, 213, 225, 0.1) 0%, #15161b 60%, #121316 100%);
            border: 1px solid rgba(203, 213, 225, 0.25);
        }

        /* 3rd Place (Right - Bronze) */
        .podium-column.third {
            min-height: 150px;
            background: linear-gradient(180deg, rgba(217, 119, 6, 0.1) 0%, #15161b 60%, #121316 100%);
            border: 1px solid rgba(217, 119, 6, 0.25);
        }

        .podium-avatar-wrap {
            position: relative;
            margin-bottom: 8px;
        }

        .podium-avatar-img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #282932;
            background: #27272a;
        }

        .podium-column.first .podium-avatar-img {
            width: 50px;
            height: 50px;
            border-color: #f59e0b;
        }

        .podium-badge-pill {
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            font-weight: 800;
            padding: 1px 7px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .badge-gold {
            background: #f59e0b;
            color: #000000;
        }

        .badge-silver {
            background: #94a3b8;
            color: #000000;
        }

        .badge-bronze {
            background: #d97706;
            color: #ffffff;
        }

        .podium-username {
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 85px;
            margin-top: 4px;
            margin-bottom: 4px;
        }

        .podium-amount {
            font-size: 12px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.2;
        }

        .podium-subtext {
            font-size: 10px;
            font-weight: 600;
            color: #71717a;
            margin-top: 2px;
        }

        /* Leaderboard List Rows */
        .rating-list-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 18px;
        }

        .leader-row-card {
            background: #141418;
            border: 1px solid #222228;
            border-radius: 18px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .leader-row-card:active {
            background: #1a1a22;
        }

        .leader-row-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .leader-row-rank {
            font-size: 13px;
            font-weight: 800;
            color: #71717a;
            width: 22px;
            text-align: center;
            flex-shrink: 0;
        }

        .leader-row-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            overflow: hidden;
            background: #27272a;
            border: 1px solid #2e2f38;
            flex-shrink: 0;
        }

        .leader-row-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .leader-row-username {
            font-size: 14px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 130px;
        }

        .leader-row-right {
            text-align: right;
            flex-shrink: 0;
        }

        .leader-row-turnover-val {
            font-size: 14px;
            font-weight: 800;
            color: #ffffff;
        }

        .leader-row-turnover-label {
            font-size: 10px;
            font-weight: 600;
            color: #71717a;
            margin-top: 1px;
        }

        /* User My Rank Dock */
        .user-my-rank-dock {
            background: #141418;
            border: 1px solid #2f303a;
            border-radius: 20px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        /* Bottom Minimal Dock Navigation */
        .bottom-dock-nav {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: rgba(18, 19, 22, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            backdrop-filter: blur(20px);
            z-index: 100;
        }

        .dock-tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            border-radius: 18px;
            color: #71717a;
            cursor: pointer;
        }

        .dock-tab-btn.active {
            color: #ffffff;
        }
    </style>
</head>

<body>

    <!-- Top Brand Header -->
    <div class="rating-top-brand">
        <img src="./images/logo.png" alt="CoinStat">
        <span>CoinStat UZ</span>
    </div>
    <div class="rating-page-title">Top Reyting</div>

    <!-- Period Filter Tabs -->
    <div class="period-tabs-bar">
        <button class="period-tab-btn" onclick="switchPeriod('today', this)">Bugun</button>
        <button class="period-tab-btn active" onclick="switchPeriod('week', this)">Haftalik</button>
        <button class="period-tab-btn" onclick="switchPeriod('month', this)">Oylik</button>
        <button class="period-tab-btn" onclick="switchPeriod('all', this)">Barchasi</button>
    </div>

    <!-- Top 3 Leaderboard Podium -->
    <div class="podium-box-container">
        <div class="podium-box-header">🏆 Top 3 Yetakchilar</div>
        <div class="podium-cylinders-row">
            <!-- #2 Second (Left) -->
            <div class="podium-column second" id="podium2">
                <div class="podium-avatar-wrap">
                    <img src="./images/logo.png" id="podiumAvatar2" class="podium-avatar-img" alt="2nd">
                    <div class="podium-badge-pill badge-silver">🥈 #2</div>
                </div>
                <div class="podium-username" id="podiumUser2">@usdt_guru</div>
                <div class="podium-amount" id="podiumAmount2">70 000 000 UZS</div>
                <div class="podium-subtext">Aylanma</div>
            </div>

            <!-- #1 First (Center) -->
            <div class="podium-column first" id="podium1">
                <div class="podium-avatar-wrap">
                    <img src="./images/logo.png" id="podiumAvatar1" class="podium-avatar-img" alt="1st">
                    <div class="podium-badge-pill badge-gold">🥇 #1</div>
                </div>
                <div class="podium-username" id="podiumUser1">@crypto_king</div>
                <div class="podium-amount" id="podiumAmount1">120 500 000 UZS</div>
                <div class="podium-subtext">Aylanma</div>
            </div>

            <!-- #3 Third (Right) -->
            <div class="podium-column third" id="podium3">
                <div class="podium-avatar-wrap">
                    <img src="./images/logo.png" id="podiumAvatar3" class="podium-avatar-img" alt="3rd">
                    <div class="podium-badge-pill badge-bronze">🥉 #3</div>
                </div>
                <div class="podium-username" id="podiumUser3">@coin_master</div>
                <div class="podium-amount" id="podiumAmount3">60 800 000 UZS</div>
                <div class="podium-subtext">Aylanma</div>
            </div>
        </div>
    </div>

    <!-- Leaderboard List Rows -->
    <div class="rating-list-wrapper" id="leaderboardList">
        <!-- Rendered dynamically -->
    </div>

    <!-- User My Rank Dock -->
    <div class="user-my-rank-dock">
        <div class="leader-row-left">
            <div class="leader-row-avatar">
                <img src="./images/logo.png" id="myAvatarImg" alt="User">
            </div>
            <div>
                <div style="font-size: 13px; font-weight: 800; color: #ffffff;">
                    Sizning o'rningiz: <span id="myRankNum" style="color: #f59e0b;">#1</span>
                </div>
                <div style="font-size: 10px; font-weight: 600; color: #71717a;">Umumiy reytingda</div>
            </div>
        </div>
        <div class="leader-row-right">
            <div class="leader-row-turnover-val" id="myTurnoverVal">0 UZS</div>
            <div class="leader-row-turnover-label">Aylanma</div>
        </div>
    </div>

    <!-- Floating Minimal Dock Navigation -->
    <div class="bottom-dock-nav">
        <div class="dock-tab-btn" onclick="window.location.href='index.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Asosiy</span>
        </div>
        <div class="dock-tab-btn" onclick="window.location.href='gift.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line></svg>
            <span>Gift</span>
        </div>
        <div class="dock-tab-btn active" onclick="window.location.href='rating.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.45 1-1 1H7v4h10v-4h-2c-.55 0-1-.45-1-1v-2.34"></path><path d="M18 4H6v7a6 6 0 0 0 12 0V4z"></path></svg>
            <span>Top</span>
        </div>
        <div class="dock-tab-btn" onclick="window.location.href='profile.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Profil</span>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
        function switchPeriod(period, btn) {
            document.querySelectorAll('.period-tab-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            loadRatingData(period);
        }

        async function loadRatingData(period = 'week') {
            const apiBase = getApiBase();
            const currentUserId = String(getUserId() || '');

            try {
                const res = await fetch((apiBase ? apiBase : '') + '/api/rating', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': tg.initData || '' },
                    body: JSON.stringify({ period: period, initData: tg.initData || '' })
                });
                const data = await res.json();
                let list = (data && data.ok && data.rating && data.rating.length) ? data.rating : [
                    { username: 'crypto_king', total: 120500000 },
                    { username: 'usdt_guru', total: 70000000 },
                    { username: 'coin_master', total: 60800000 },
                    { username: 'trading_pro', total: 45200000 },
                    { username: 'invest_queen', total: 31100000 },
                    { username: 'market_wiz', total: 26800000 }
                ];

                renderPodiumAndList(list, currentUserId);
            } catch (err) {
                let demoList = [
                    { username: 'crypto_king', total: 120500000 },
                    { username: 'usdt_guru', total: 70000000 },
                    { username: 'coin_master', total: 60800000 },
                    { username: 'trading_pro', total: 45200000 },
                    { username: 'invest_queen', total: 31100000 },
                    { username: 'market_wiz', total: 26800000 }
                ];
                renderPodiumAndList(demoList, currentUserId);
            }
        }

        function renderPodiumAndList(list, currentUserId) {
            // #1
            if (list[0]) {
                document.getElementById('podiumUser1').textContent = '@' + (list[0].username || 'User#1');
                document.getElementById('podiumAmount1').textContent = Number(list[0].total || 0).toLocaleString('uz-UZ') + ' UZS';
            }
            // #2
            if (list[1]) {
                document.getElementById('podiumUser2').textContent = '@' + (list[1].username || 'User#2');
                document.getElementById('podiumAmount2').textContent = Number(list[1].total || 0).toLocaleString('uz-UZ') + ' UZS';
            }
            // #3
            if (list[2]) {
                document.getElementById('podiumUser3').textContent = '@' + (list[2].username || 'User#3');
                document.getElementById('podiumAmount3').textContent = Number(list[2].total || 0).toLocaleString('uz-UZ') + ' UZS';
            }

            // Remaining list rows (from #4 onwards)
            const container = document.getElementById('leaderboardList');
            let html = '';
            let myRank = null;
            let myTurnover = 0;

            list.forEach((item, i) => {
                const rank = i + 1;
                const uname = item.username ? '@' + item.username : 'User#' + (item.telegram_id || (i + 1));
                const totalFormatted = Number(item.total || 0).toLocaleString('uz-UZ') + ' UZS';

                if (String(item.telegram_id) === currentUserId || (tg.initDataUnsafe?.user?.username && item.username === tg.initDataUnsafe.user.username)) {
                    myRank = rank;
                    myTurnover = item.total || 0;
                }

                if (rank > 3) {
                    html += `
                        <div class="leader-row-card">
                            <div class="leader-row-left">
                                <div class="leader-row-rank">#${rank}</div>
                                <div class="leader-row-avatar">
                                    <img src="./images/logo.png" alt="${uname}">
                                </div>
                                <div class="leader-row-username">${uname}</div>
                            </div>
                            <div class="leader-row-right">
                                <div class="leader-row-turnover-val">${totalFormatted}</div>
                                <div class="leader-row-turnover-label">Aylanma</div>
                            </div>
                        </div>
                    `;
                }
            });

            container.innerHTML = html;

            const myRankEl = document.getElementById('myRankNum');
            const myTurnoverEl = document.getElementById('myTurnoverVal');
            if (myRankEl) myRankEl.textContent = myRank ? `#${myRank}` : '#1';
            if (myTurnoverEl) myTurnoverEl.textContent = myTurnover ? Number(myTurnover).toLocaleString('uz-UZ') + ' UZS' : '0 UZS';

            if (tg.initDataUnsafe?.user?.photo_url) {
                const myAv = document.getElementById('myAvatarImg');
                if (myAv) myAv.src = tg.initDataUnsafe.user.photo_url;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadRatingData('week');
        });
    </script>
</body>

</html>
