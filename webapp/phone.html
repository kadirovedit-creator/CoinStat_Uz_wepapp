<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoinStat UZ - Virtual Nomer</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css?v=12.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            padding: 16px;
            padding-bottom: 110px;
            min-height: 100vh;
        }

        /* Top Bar */
        .phone-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding: 4px 0;
        }

        .back-pill-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #141418;
            border: 1px solid #222228;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .back-pill-btn:active {
            transform: scale(0.92);
        }

        .balance-badge-pill {
            background: #141418;
            border: 1px solid #222228;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 14px;
            border-radius: 999px;
        }

        .phone-page-heading {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 20px;
        }

        .country-card-box {
            background: #141418;
            border: 1px solid #222228;
            border-radius: 22px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .country-card-box.selected {
            border-color: #ffffff;
            background: #1a1a22;
        }

        .country-left-col {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .country-flag {
            font-size: 24px;
        }

        .country-name-text {
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
        }

        .country-subtext {
            font-size: 12px;
            color: #71717a;
        }

        .country-price-text {
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
        }

        .phone-submit-button {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 16px;
            padding: 15px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            margin-top: 10px;
        }

        .phone-submit-button:active {
            transform: scale(0.98);
            background: #e4e4e7;
        }

        /* Bottom Minimal Dock Navigation */
        .bottom-dock-nav {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: rgba(18, 19, 22, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            backdrop-filter: blur(20px);
            z-index: 100;
        }

        .dock-tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            border-radius: 18px;
            color: #71717a;
            cursor: pointer;
        }

        .dock-tab-btn.active {
            color: #ffffff;
        }
    </style>
</head>

<body>

    <!-- Top Bar -->
    <div class="phone-top-bar">
        <div class="back-pill-btn" onclick="window.location.href='index.html'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </div>
        <div class="balance-badge-pill">
            <span id="balance">0</span> UZS
        </div>
    </div>

    <div class="phone-page-heading">Virtual Nomer</div>

    <!-- Country Presets -->
    <div class="country-card-box selected" onclick="selectCountry('AQSH (+1)', 18000, this)">
        <div class="country-left-col">
            <span class="country-flag">🇺🇸</span>
            <div>
                <div class="country-name-text">AQSH (+1)</div>
                <div class="country-subtext">Telegram SMS uchun</div>
            </div>
        </div>
        <div class="country-price-text">18 000 UZS</div>
    </div>

    <div class="country-card-box" onclick="selectCountry('Angliya (+44)', 22000, this)">
        <div class="country-left-col">
            <span class="country-flag">🇬🇧</span>
            <div>
                <div class="country-name-text">Angliya (+44)</div>
                <div class="country-subtext">Telegram SMS uchun</div>
            </div>
        </div>
        <div class="country-price-text">22 000 UZS</div>
    </div>

    <div class="country-card-box" onclick="selectCountry('Rossiya (+7)', 15000, this)">
        <div class="country-left-col">
            <span class="country-flag">🇷🇺</span>
            <div>
                <div class="country-name-text">Rossiya (+7)</div>
                <div class="country-subtext">Telegram SMS uchun</div>
            </div>
        </div>
        <div class="country-price-text">15 000 UZS</div>
    </div>

    <div class="country-card-box" onclick="selectCountry('Indoneziya (+62)', 12000, this)">
        <div class="country-left-col">
            <span class="country-flag">🇮🇩</span>
            <div>
                <div class="country-name-text">Indoneziya (+62)</div>
                <div class="country-subtext">Telegram SMS uchun</div>
            </div>
        </div>
        <div class="country-price-text">12 000 UZS</div>
    </div>

    <button class="phone-submit-button" id="buyPhoneBtn" onclick="buyNumber()">Nomer olish</button>

    <!-- Floating Minimal Dock Navigation -->
    <div class="bottom-dock-nav">
        <div class="dock-tab-btn" onclick="window.location.href='index.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </div>
        <div class="dock-tab-btn" onclick="window.location.href='orders.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        </div>
        <div class="dock-tab-btn" onclick="window.location.href='gift.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line></svg>
        </div>
        <div class="dock-tab-btn" onclick="window.location.href='rating.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.45 1-1 1H7v4h10v-4h-2c-.55 0-1-.45-1-1v-2.34"></path><path d="M18 4H6v7a6 6 0 0 0 12 0V4z"></path></svg>
        </div>
        <div class="dock-tab-btn" onclick="window.location.href='profile.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
        let selectedCountry = 'AQSH (+1)';
        let selectedPrice = 18000;

        function selectCountry(country, price, el) {
            selectedCountry = country;
            selectedPrice = price;
            document.querySelectorAll('.country-card-box').forEach(c => c.classList.remove('selected'));
            if (el) el.classList.add('selected');
        }

        async function buyNumber() {
            const btn = document.getElementById('buyPhoneBtn');
            const oldText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '⏳ ...';

            const userId = getUserId();
            const apiBase = getApiBase();

            try {
                const res = await fetch((apiBase ? apiBase : '') + '/api/order/stars', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': tg.initData || '' },
                    body: JSON.stringify({
                        telegram_id: userId,
                        product_type: `Virtual Nomer (${selectedCountry})`,
                        amount: selectedPrice,
                        initData: tg.initData || ''
                    })
                });

                const data = await res.json();
                if (data && data.ok) {
                    if (tg.showAlert) tg.showAlert(`✅ ${selectedCountry} raqami uchun so'rov qabul qilindi!`);
                    else alert(`✅ ${selectedCountry} raqami uchun so'rov qabul qilindi!`);
                    setTimeout(() => window.location.href = 'orders.html', 1000);
                } else {
                    const err = data?.error || 'Xaridda xatolik yuz berdi.';
                    if (tg.showAlert) tg.showAlert(err);
                    else alert(err);
                }
            } catch (err) {
                if (tg.showAlert) tg.showAlert('Xatolik: ' + err.message);
                else alert('Xatolik: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = oldText;
            }
        }

        document.addEventListener('DOMContentLoaded', loadUserBalance);
    </script>
</body>

</html>
