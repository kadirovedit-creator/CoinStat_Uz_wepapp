<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StarPayUz - Premium</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>window.API_BASE = 'https://test-uz-r78q.onrender.com';</script>
    <link rel="stylesheet" href="css/style.css?v=10.0">
    <style>
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .header-left__image {
            width: 44px;
            height: 44px;
            border-radius: 12px;
        }

        .balance-badge {
            color: #ffffff;
            font-weight: 700;
            border: 1px solid rgba(56, 189, 248, 0.3);
            background: rgba(13, 19, 34, 0.8);
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }

        .page-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .page-title img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .page-title h2 {
            color: var(--text-main);
            font-size: 20px;
            font-weight: 800;
        }

        .section-label {
            display: block;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .premium-plans-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        .plan-card {
            background: rgba(13, 19, 34, 0.8);
            border: 1px solid var(--border-card);
            border-radius: 18px;
            padding: 16px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .plan-card:hover, .plan-card.active {
            border-color: #ffffff !important;
            background: rgba(255, 255, 255, 0.08) !important;
            box-shadow: 0 4px 16px rgba(255, 255, 255, 0.15) !important;
            transform: translateY(-2px);
        }

        .plan-duration {
            font-size: 16px;
            font-weight: 800;
            color: #ffffff;
        }

        .plan-price {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-sky);
        }

        .plan-badge {
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 999px;
            background: rgba(236, 72, 153, 0.2);
            color: #f472b6;
            margin-bottom: 2px;
        }
    </style>
</head>

<body>

    <!-- Loader -->
    <div class="loader-overlay" id="loaderOverlay">
        <div class="loader-star">
            <div class="loader-ring"></div>
            <div class="loader-ring"></div>
            <div class="loader-ring"></div>
            <img src="./images/loader.webp" alt="Loader">
        </div>
        <div class="loader-text">CoinStat UZ</div>
        <div class="loader-sub" data-i18n="loader.sub">Yuklanmoqda...</div>
    </div>

    <!-- Top Profile Header Bar (Horizontal Left-Aligned Layout matching reference screenshot) -->
    <div class="top-header-bar">
        <div class="top-header-left">
            <div class="user-avatar-wrap">
                <img src="" id="avatarImg" style="display:none;" alt="Avatar">
                <span class="user-avatar-initial" id="avatarPlaceholder">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                        <polyline points="17 6 23 6 23 12"></polyline>
                    </svg>
                </span>
            </div>
            <div class="user-meta-col">
                <div class="user-title-name" id="profileName">CoinStat UZ</div>
                <div class="user-id-row" onclick="copyUserId()" title="Nusxalash">
                    <span id="profileUserId">ID: —</span>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                </div>
            </div>
        </div>

        <button class="lang-pill-btn" onclick="toggleLanguage()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
            <span data-i18n-lang="profile.lang_">Русский</span>
            <span style="opacity:0.6; font-size:10px;">v</span>
        </button>
    </div>

    <!-- Hero Balans Card -->
    <div class="hero-balance-card">
        <div class="balance-card-label">BALANS</div>
        <div class="balance-card-amount">
            <span id="balance">0 so'm</span>
        </div>
        <div class="balance-card-actions">
            <button class="balance-stars-pill" onclick="openStars()">
                <span>⭐</span>
                <span>≈ <span id="starsEquivalent">0</span> Stars</span>
                <span style="opacity:0.7;">→</span>
            </button>
            <button class="balance-topup-btn" onclick="window.location.href='topup.html'">
                <span>+</span>
                <span>To'ldirish</span>
            </button>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs-container">
        <div class="tabs">
            <button class="tab" onclick="openStars()" data-i18n="stars.tab">Stars olish</button>
            <button class="tab active" data-i18n="premium.tab">Premium olish</button>
        </div>
    </div>

    <!-- Content -->
    <div class="content">
        <div class="page-title">
            <img src="./images/premium.webp" alt="Premium">
            <h2 data-i18n="premium.title">Premium sotib olish</h2>
        </div>

        <!-- Username Input -->
        <h3 class="section-label" data-i18n="common.recipient">Qabul qiluvchi</h3>
        <div class="input-wrapper">
            <img src="./images/user.webp" class="inside-icon" alt="User">
            <input type="text" id="username" data-i18n-placeholder="common.enter_username" placeholder="Username kiriting" class="input">
        </div>

        <!-- Premium Duration Select Cards -->
        <h3 class="section-label" data-i18n="premium.duration">Davomiylik</h3>
        
        <div class="premium-plans-grid">
            <div class="plan-card" onclick="selectPlan(3, 160000, this)">
                <span class="plan-badge">Standard</span>
                <div class="plan-duration">3 OY</div>
                <div class="plan-price">160K UZS</div>
            </div>
            <div class="plan-card active" onclick="selectPlan(6, 225000, this)">
                <span class="plan-badge">🔥 Popular</span>
                <div class="plan-duration">6 OY</div>
                <div class="plan-price">225K UZS</div>
            </div>
            <div class="plan-card" onclick="selectPlan(12, 380000, this)">
                <span class="plan-badge">💎 Best Value</span>
                <div class="plan-duration">12 OY</div>
                <div class="plan-price">380K UZS</div>
            </div>
        </div>

        <input type="hidden" id="premiumSelect" value="6-225000">

        <!-- Buy Button -->
        <button class="btn-primary" id="buyBtn" onclick="buyPremium()">Sotib olish</button>
    </div>

    <!-- Floating Glass Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="openHome()">
            <div class="nav-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            </div>
            <div class="nav-label">Asosiy</div>
        </div>

        <div class="nav-item" onclick="openGifts()">
            <div class="nav-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line></svg>
            </div>
            <div class="nav-label">Gift</div>
        </div>

        <div class="nav-item" onclick="openReyting()">
            <div class="nav-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.45 1-1 1H7v4h10v-4h-2c-.55 0-1-.45-1-1v-2.34"></path><path d="M18 4H6v7a6 6 0 0 0 12 0V4z"></path></svg>
            </div>
            <div class="nav-label">Top</div>
        </div>

        <div class="nav-item" onclick="openProfile()">
            <div class="nav-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
            <div class="nav-label">Profil</div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
        let selectedMonths = 6;
        let selectedPrice = 225000;

        function selectPlan(months, price, cardEl) {
            selectedMonths = months;
            selectedPrice = price;
            document.querySelectorAll('.plan-card').forEach(c => c.classList.remove('active'));
            if (cardEl) cardEl.classList.add('active');
            document.getElementById('buyBtn').disabled = false;
        }

        function buyPremium() {
            if (selectedMonths === 0) {
                tg.showAlert('Iltimos, davomiylikni tanlang!');
                return;
            }

            const username = getUsername('username');
            if (!username) {
                tg.showAlert('Iltimos, username kiriting!');
                return;
            }

            submitOrder({
                action: 'buy_premium',
                duration: selectedMonths,
                price: selectedPrice,
                username: username
            });
        }

        function openHome() {
            window.location.href = 'index.html';
        }

        function openStars() {
            window.location.href = 'stars.html';
        }

        function openGifts() {
            window.location.href = 'gift.html';
        }

        function openReyting() {
            window.location.href = 'rating.html';
        }

        function openProfile() {
            window.location.href = 'profile.html';
        }
    </script>
</body>

</html>
