<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoinStat UZ - Gift</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css?v=10.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 20px;
            padding-bottom: 200px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .header-left__image {
            width: 60px;
            height: 60px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .balance-badge {
            color: var(--text-main);
            font-weight: 600;
            border: 1px solid var(--accent-sky);
            background: var(--bg-card);
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            transition: .3s;
        }

        .balance-badge:hover {
            background: var(--accent-blue);
            box-shadow: 0 0 20px rgba(59, 130, 246, .35);
        }

        .add-button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: var(--accent-blue);
            color: #fff;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: .3s;
            box-shadow: 0 0 20px rgba(59, 130, 246, .3);
        }

        .add-button:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 0 30px rgba(59, 130, 246, .5);
        }

        .page-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .page-title h2 {
            color: var(--accent-sky);
            font-size: 22px;
            font-weight: 700;
        }

        .page-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
            text-align: left;
        }

        /* Tabs */
        .gift-tabs {
            display: flex;
            padding: 5px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            backdrop-filter: blur(16px);
            border-radius: 999px;
            gap: 6px;
            margin-bottom: 20px;
        }

        .gift-tab {
            flex: 1;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 700;
            padding: 12px;
            border-radius: 999px;
            cursor: pointer;
            transition: .3s;
        }

        .gift-tab:hover {
            color: var(--text-main);
            background: rgba(59, 130, 246, .15);
        }

        .gift-tab {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .gift-tab img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            flex-shrink: 0;
        }
        .gift-tab.active {
            background: var(--accent-gradient);
            color: #fff;
            box-shadow: 0 0 20px rgba(59, 130, 246, .4);
        }

        .section-label {
            display: block;
            color: var(--text-main);
            font-weight: 600;
            margin-bottom: 10px;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .inside-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 22px;
            height: 22px;
        }

        .input {
            width: 100%;
            height: 56px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 18px;
            padding-left: 50px;
            padding-right: 15px;
            color: var(--text-main);
            font-size: 16px;
            outline: none;
            transition: .3s;
        }

        .input::placeholder {
            color: var(--text-muted);
        }

        .input:focus {
            border-color: var(--accent-sky);
            box-shadow: 0 0 20px rgba(59, 130, 246, .35);
        }

        /* Selected gift info */
        .selected-gift-info {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 18px;
            padding: 14px 18px;
            margin-bottom: 16px;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
        }

        .selected-gift-info strong {
            color: var(--accent-sky);
        }

        /* Gift Grid */
        .gift-section {
            display: none;
        }
        .gift-section.active {
            display: block;
        }

        .gift-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .gift-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            backdrop-filter: blur(16px);
            border-radius: 18px;
            padding: 20px 14px;
            text-align: center;
            cursor: pointer;
            transition: all .25s ease;
            position: relative;
            overflow: hidden;
        }

        .gift-card:hover {
            border-color: rgba(59, 130, 246, 0.4);
            transform: translateY(-2px);
        }

        .gift-card.selected {
            border-color: var(--accent-sky);
            background: rgba(2, 132, 199, 0.15);
            box-shadow: 0 0 25px rgba(59, 130, 246, .2);
        }

        .gift-card .gift-emoji {
            font-size: 48px;
            margin-bottom: 10px;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
        }

        .gift-card .gift-emoji img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        .gift-card .gift-name {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
        }

        .gift-card .gift-price {
            font-size: 14px;
            font-weight: 600;
            color: #3B82F6;
        }

        .gift-card .gift-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 3px 8px;
            border-radius: 999px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .gift-card .gift-badge.limited {
            background: rgba(255, 107, 157, 0.9);
            color: #fff;
        }

        .gift-card .gift-badge.rare {
            background: rgba(147, 51, 234, 0.9);
            color: #fff;
        }

        .gift-card .gift-badge.epic {
            background: rgba(255, 215, 0, 0.9);
            color: #000;
        }

        .gift-card .gift-badge.legend {
            background: rgba(147, 51, 234, 0.9);
            color: #fff;
        }

        .gift-card .gift-badge.mythic {
            background: linear-gradient(135deg, #FF6B9D, #FFD700);
            color: #fff;
        }

        /* NFT card special style */
        .gift-card.nft {
            background: linear-gradient(135deg, #1a1f35 0%, #0f1219 100%);
        }

        .gift-card.nft::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, #FFD700, #FF6B9D, #9F7AEA);
            border-radius: 18px;
            z-index: -1;
            opacity: 0;
            transition: .3s;
        }

        .gift-card.nft:hover::before {
            opacity: 1;
        }

        .gift-card.nft.selected {
            background: linear-gradient(135deg, #FFD700 0%, #FF6B9D 100%);
        }

        .gift-card.nft .gift-emoji {
            position: relative;
        }

        .gift-card.nft .gift-glow {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.3) 0%, transparent 70%);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .gift-card.nft .gift-emoji img,
        .gift-card.nft .gift-emoji div {
            position: relative;
            z-index: 1;
        }

        .gift-card.nft .gift-name {
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .gift-card.nft .gift-price {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Buy button */
        .btn-primary {
            width: 100%;
            height: 58px;
            border: none;
            border-radius: 18px;
            background: #3B82F6;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: .3s;
            box-shadow: 0 0 25px rgba(59, 130, 246, .3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 8px;
            margin-bottom: 20px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 35px rgba(59, 130, 246, .45);
        }

        .btn-primary:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }



        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-box {
            background: var(--bg-card-solid);
            border: 1px solid var(--border-card);
            color: var(--text-main);
            border-radius: 22px;
            padding: 28px 24px;
            max-width: 380px;
            width: 100%;
            position: relative;
            animation: modalIn .3s ease;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        @keyframes modalIn {
            from { transform: scale(.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 22px;
            color: #9CA3AF;
            cursor: pointer;
            background: none;
            border: none;
            line-height: 1;
        }
        .modal-close:hover {
            color: #fff;
        }
        .modal-gift-top {
            text-align: center;
            margin-bottom: 16px;
        }
        .modal-gift-emoji {
            font-size: 56px;
            margin-bottom: 4px;
        }
        .modal-gift-emoji img {
            width: 64px;
            height: 64px;
            object-fit: contain;
        }
        .modal-gift-name {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }
        .modal-section-label {
            font-size: 13px;
            font-weight: 600;
            color: #9CA3AF;
            margin-bottom: 8px;
        }
        .modal-input-wrapper {
            position: relative;
            margin-bottom: 10px;
        }
        .modal-input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
        }
        .modal-input {
            width: 100%;
            height: 48px;
            background: #1E293B;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 14px;
            padding-left: 42px;
            padding-right: 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: .3s;
        }
        .modal-input:focus {
            border-color: #3B82F6;
        }
        .modal-input::placeholder {
            color: #6B7280;
        }
        .modal-options {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }
        .modal-option {
            flex: 1;
            height: 40px;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 12px;
            background: #1E293B;
            color: #9CA3AF;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: .3s;
        }
        .modal-option:hover {
            border-color: #3B82F6;
            color: #fff;
        }
        .modal-option.active {
            background: #031632;
            border-color: #3B82F6;
            color: #3B82F6;
        }
        .modal-divider {
            height: 1px;
            background: rgba(255,255,255,.08);
            margin: 14px 0;
        }
        .modal-summary {
            margin-bottom: 4px;
        }
        .modal-summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #9CA3AF;
            padding: 4px 0;
        }
        .modal-summary-row.modal-total {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            border-top: 1px solid rgba(255,255,255,.08);
            padding-top: 10px;
            margin-top: 4px;
        }
        .modal-summary-row.modal-total span:last-child {
            color: #3B82F6;
        }
        .modal-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 16px;
            background: #3B82F6;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: .3s;
            box-shadow: 0 0 25px rgba(59,130,246,.3);
            margin-top: 14px;
        }
        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 35px rgba(59,130,246,.45);
        }
        .modal-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .section-header h3 {
            color: #fff;
            font-size: 15px;
            font-weight: 600;
        }

        .section-count {
            color: #9CA3AF;
            font-size: 12px;
            background: #1E293B;
            padding: 4px 10px;
            border-radius: 999px;
        }
    </style>

    <script>
        let selectedGift = null;
        let selectedGiftPrice = 0;
        let selectedGiftName = '';

        // Tab switching
        function switchTab(tab) {
            document.querySelectorAll('.gift-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.gift-section').forEach(s => s.classList.remove('active'));

            if (tab === 'regular') {
                document.querySelector('.gift-tab').classList.add('active');
                document.getElementById('sectionRegular').classList.add('active');
            } else {
                document.querySelectorAll('.gift-tab')[1].classList.add('active');
                document.getElementById('sectionNft').classList.add('active');
            }
        }

        function pickGift(el, name, price, slug) {
            if (tg && tg.showPopup) {
                tg.showPopup({
                    title: "🛠️ Ta'mirlash ishlari",
                    message: "Giftlar bo'limida profilaktika va ta'mirlash ishlari olib borilmoqda. Xizmat tez orada qayta ishga tushadi!",
                    buttons: [{ type: 'ok' }]
                });
            } else {
                alert("Giftlar bo'limida profilaktika va ta'mirlash ishlari olib borilmoqda.");
            }
        }

        function closeModal() {
            document.getElementById('buyModal').classList.remove('open');
        }

        function setForMyself() {
            const user = tg.initDataUnsafe?.user;
            if (user?.username) {
                document.getElementById('modalUsername').value = '@' + user.username;
            }
            document.querySelectorAll('.modal-option').forEach(b => b.classList.remove('active'));
            document.getElementById('forMyselfBtn').classList.add('active');
        }

        function setAnonymous() {
            document.getElementById('modalUsername').value = '';
            document.querySelectorAll('.modal-option').forEach(b => b.classList.remove('active'));
            document.getElementById('anonymousBtn').classList.add('active');
        }

        function buyGift() {
            if (tg && tg.showPopup) {
                tg.showPopup({
                    title: "🛠️ Ta'mirlash ishlari",
                    message: "Giftlar bo'limida profilaktika va ta'mirlash ishlari olib borilmoqda. Xizmat tez orada qayta ishga tushadi!",
                    buttons: [{ type: 'ok' }]
                });
            } else {
                alert("Giftlar bo'limida profilaktika va ta'mirlash ishlari olib borilmoqda.");
            }
        }

        function openHome() { window.location.href = 'index.html'; }
        function openStars() { window.location.href = 'stars.html'; }
        function openReyting() { window.location.href = 'rating.html'; }
        function openProfile() { window.location.href = 'profile.html'; }
        function openGifts() { window.location.href = 'gift.html'; }
    </script>
</body>
</html>
