<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoinStat UZ - Telegram Sovg'alari</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css?v=11.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b111d;
            color: #ffffff;
            padding: 16px;
            padding-bottom: 120px;
            min-height: 100vh;
        }

        /* Top Header */
        .gift-header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 16px;
            margin-bottom: 24px;
            margin-top: 4px;
        }

        .back-btn-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #172133;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .back-btn-circle:active {
            transform: scale(0.92);
            background: #1e2c44;
        }

        .header-title-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(236, 72, 153, 0.15);
            border: 1px solid rgba(236, 72, 153, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .header-title-text {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        /* Recipient Input Bar */
        .recipient-bar {
            background: #111a2c;
            border: 1px solid #1f2d48;
            border-radius: 18px;
            padding: 6px 8px 6px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        .recipient-input-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
        }

        .recipient-at {
            color: #64748b;
            font-size: 16px;
            font-weight: 600;
        }

        .recipient-input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
        }

        .recipient-input::placeholder {
            color: #64748b;
            font-size: 14px;
            font-weight: 500;
        }

        .for-myself-btn {
            background: #2563eb;
            color: #ffffff;
            border: none;
            outline: none;
            padding: 10px 18px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        }

        .for-myself-btn:active {
            transform: scale(0.94);
        }

        /* Gifts Grid */
        .gifts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .gift-card {
            background: #111a2c;
            border: 1px solid #1f2d48;
            border-radius: 20px;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
            position: relative;
        }

        .gift-card:hover {
            border-color: rgba(236, 72, 153, 0.4);
            background: #141f35;
        }

        .gift-card.selected {
            background: #19202c;
            border: 1.5px solid #ec4899 !important;
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.2);
        }

        .gift-emoji {
            font-size: 38px;
            margin-bottom: 8px;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
        }

        .gift-name {
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .gift-price {
            font-size: 13px;
            font-weight: 700;
            color: #38bdf8;
        }

        /* Bottom Floating Action Bar */
        .gift-bottom-action {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(180deg, transparent 0%, #0b111d 30%, #0b111d 100%);
            padding: 16px;
            z-index: 100;
        }

        .gift-buy-btn {
            width: 100%;
            background: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 20px;
            padding: 18px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .gift-buy-btn:active {
            transform: scale(0.98);
        }

        .gift-buy-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="gift-header">
        <div class="back-btn-circle" onclick="window.location.href='index.html'">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </div>
        <div class="header-title-box">
            <div class="header-logo-icon">🎁</div>
            <div class="header-title-text">Telegram Sovg'alari</div>
        </div>
    </div>

    <!-- Recipient Bar -->
    <div class="recipient-bar">
        <div class="recipient-input-wrap">
            <span class="recipient-at">@</span>
            <input type="text" id="username" class="recipient-input" placeholder="Foydalanuvchi nomi">
        </div>
        <button type="button" class="for-myself-btn" onclick="setMyUsername()">O'zimga</button>
    </div>

    <!-- Gifts Grid -->
    <div class="gifts-grid">
        <div class="gift-card selected" onclick="selectGift('Delicious Cake 🎂', 15000, this)">
            <div class="gift-emoji">🎂</div>
            <div class="gift-name">Delicious Cake</div>
            <div class="gift-price">15 000 so'm</div>
        </div>

        <div class="gift-card" onclick="selectGift('Green Star ⭐', 25000, this)">
            <div class="gift-emoji">⭐</div>
            <div class="gift-name">Green Star</div>
            <div class="gift-price">25 000 so'm</div>
        </div>

        <div class="gift-card" onclick="selectGift('Golden Box 🎁', 50000, this)">
            <div class="gift-emoji">🎁</div>
            <div class="gift-name">Golden Box</div>
            <div class="gift-price">50 000 so'm</div>
        </div>

        <div class="gift-card" onclick="selectGift('Luxury Heart ❤️', 80000, this)">
            <div class="gift-emoji">❤️</div>
            <div class="gift-name">Luxury Heart</div>
            <div class="gift-price">80 000 so'm</div>
        </div>

        <div class="gift-card" onclick="selectGift('Royal Crown 👑', 150000, this)">
            <div class="gift-emoji">👑</div>
            <div class="gift-name">Royal Crown</div>
            <div class="gift-price">150 000 so'm</div>
        </div>

        <div class="gift-card" onclick="selectGift('Space Rocket 🚀', 250000, this)">
            <div class="gift-emoji">🚀</div>
            <div class="gift-name">Space Rocket</div>
            <div class="gift-price">250 000 so'm</div>
        </div>

        <div class="gift-card" onclick="selectGift('Golden Trophy 🏆', 500000, this)">
            <div class="gift-emoji">🏆</div>
            <div class="gift-name">Golden Trophy</div>
            <div class="gift-price">500 000 so'm</div>
        </div>

        <div class="gift-card" onclick="selectGift('Cyber Diamond 💎', 1000000, this)">
            <div class="gift-emoji">💎</div>
            <div class="gift-name">Cyber Diamond</div>
            <div class="gift-price">1 000 000 so'm</div>
        </div>
    </div>

    <!-- Bottom Purchase Bar -->
    <div class="gift-bottom-action">
        <button type="button" class="gift-buy-btn" id="buyGiftBtn" onclick="executeBuyGift()">
            <span>🎁 Sovg'a yuborish (15 000 so'm)</span>
        </button>
    </div>

    <script src="js/common.js"></script>
    <script>
        const tg = window.Telegram?.WebApp || {};
        try { tg.expand?.(); tg.ready?.(); } catch (e) {}

        let currentGiftName = 'Delicious Cake 🎂';
        let currentGiftPrice = 15000;

        function setMyUsername() {
            const user = tg.initDataUnsafe?.user;
            const input = document.getElementById('username');
            if (input) {
                if (user && user.username) input.value = user.username;
                else if (user && user.id) input.value = user.id;
                else input.value = 'men';
            }
        }

        function selectGift(name, price, el) {
            currentGiftName = name;
            currentGiftPrice = price;

            document.querySelectorAll('.gift-card').forEach(c => c.classList.remove('selected'));
            if (el) el.classList.add('selected');

            const btn = document.getElementById('buyGiftBtn');
            if (btn) {
                btn.innerHTML = `<span>🎁 Sovg'a yuborish (${price.toLocaleString('uz-UZ')} so'm)</span>`;
            }
        }

        async function executeBuyGift() {
            let uVal = (document.getElementById('username')?.value || '').trim().replace(/^@/, '');
            if (!uVal) {
                const tgUser = tg.initDataUnsafe?.user;
                if (tgUser?.username) uVal = tgUser.username;
            }

            if (!uVal) {
                if (tg.showAlert) tg.showAlert('Iltimos, sovg\'ani oluvchi Telegram username-ni kiriting!');
                else alert('Iltimos, sovg\'ani oluvchi Telegram username-ni kiriting!');
                return;
            }

            const btn = document.getElementById('buyGiftBtn');
            btn.disabled = true;
            btn.innerHTML = '<span>⏳ Yuborilmoqda...</span>';

            const userId = getUserId();
            const apiBase = getApiBase();

            try {
                const res = await fetch((apiBase ? apiBase : '') + '/api/order/gift', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': tg.initData || '',
                    },
                    body: JSON.stringify({
                        telegram_id: userId,
                        username: uVal,
                        gift_name: currentGiftName,
                        amount: currentGiftPrice,
                        initData: tg.initData || ''
                    })
                });

                const data = await res.json();
                if (data && data.ok) {
                    if (tg.showAlert) {
                        tg.showAlert(`✅ "${currentGiftName}" sovg'asi @${uVal} ga muvaffaqiyatli yuborildi!`);
                    } else {
                        alert(`✅ "${currentGiftName}" sovg'asi @${uVal} ga muvaffaqiyatli yuborildi!`);
                    }
                    setTimeout(() => {
                        window.location.href = 'orders.html';
                    }, 1000);
                } else {
                    const err = data?.error || 'Sovg\'a yuborishda xatolik yuz berdi.';
                    if (tg.showAlert) tg.showAlert(err);
                    else alert(err);
                }
            } catch (err) {
                if (tg.showAlert) tg.showAlert('Serverga ulanishda xatolik: ' + err.message);
                else alert('Serverga ulanishda xatolik: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>🎁 Sovg'a yuborish (${currentGiftPrice.toLocaleString('uz-UZ')} so'm)</span>`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            setMyUsername();
            loadUserBalance();
        });
    </script>
</body>

</html>
