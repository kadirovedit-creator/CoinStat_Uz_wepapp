<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoinStat UZ - Telegram Stars</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css?v=12.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            padding: 16px;
            padding-bottom: 110px;
            min-height: 100vh;
        }

        /* Header */
        .stars-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding: 4px 0;
        }

        .back-pill-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #141418;
            border: 1px solid #222228;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .back-pill-btn:active {
            transform: scale(0.92);
        }

        .stars-page-heading {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stars-heading-icon {
            width: 38px;
            height: 38px;
            object-fit: contain;
        }

        .balance-badge-pill {
            background: #141418;
            border: 1px solid #222228;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            padding: 8px 14px;
            border-radius: 999px;
        }

        /* 2x2 Star Cards Grid */
        .stars-2x2-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .star-2x2-card {
            background: #141418;
            border: 1px solid #222228;
            border-radius: 22px;
            padding: 18px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            min-height: 155px;
            user-select: none;
        }

        .discount-pill {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #27272a;
            color: #a1a1aa;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 999px;
        }

        .star-quantity-row {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }

        .star-badge-icon {
            width: 24px;
            height: 24px;
            object-fit: contain;
            display: inline-block;
        }

        .star-price-row {
            font-size: 14px;
            font-weight: 700;
            color: #a1a1aa;
            margin-bottom: 14px;
        }

        .star-buy-button {
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 14px;
            padding: 12px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .star-buy-button:active {
            transform: scale(0.96);
            background: #e4e4e7;
        }

        /* Recipient Input */
        .recipient-dark-bar {
            background: #141418;
            border: 1px solid #222228;
            border-radius: 18px;
            padding: 16px 18px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .recipient-dark-input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
        }

        .recipient-dark-input::placeholder {
            color: #52525b;
        }

        .for-me-pill {
            background: #27272a;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Bottom Minimal Dock Navigation */
        .bottom-dock-nav {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: rgba(18, 19, 22, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            backdrop-filter: blur(20px);
            z-index: 100;
        }

        .dock-tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            border-radius: 18px;
            color: #71717a;
            cursor: pointer;
        }

        .dock-tab-btn.active {
            color: #ffffff;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="stars-top-bar">
        <div class="back-pill-btn" onclick="window.location.href='index.html'">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </div>
        <div class="balance-badge-pill">
            <span id="balance">0</span> UZS
        </div>
    </div>

    <div class="stars-page-heading">
        <img src="images/pasxa.webp" alt="Telegram Stars" class="stars-heading-icon">
        <span>Telegram Stars</span>
    </div>

    <!-- 2x2 Stars Grid -->
    <div class="stars-2x2-grid">
        <!-- 50 Stars -->
        <div class="star-2x2-card">
            <div>
                <div class="star-quantity-row">
                    <span>50</span>
                    <img src="images/star.webp" alt="Stars" class="star-badge-icon">
                </div>
                <div class="star-price-row">9 500 UZS</div>
            </div>
            <button class="star-buy-button" onclick="buyStarTier(50, 9500, this)">Sotib olish</button>
        </div>

        <!-- 100 Stars -->
        <div class="star-2x2-card">
            <div class="discount-pill">-15%</div>
            <div>
                <div class="star-quantity-row">
                    <span>100</span>
                    <img src="images/star.webp" alt="Stars" class="star-badge-icon">
                </div>
                <div class="star-price-row">19 000 UZS</div>
            </div>
            <button class="star-buy-button" onclick="buyStarTier(100, 19000, this)">Sotib olish</button>
        </div>

        <!-- 500 Stars -->
        <div class="star-2x2-card">
            <div class="discount-pill">-15%</div>
            <div>
                <div class="star-quantity-row">
                    <span>500</span>
                    <img src="images/star.webp" alt="Stars" class="star-badge-icon">
                </div>
                <div class="star-price-row">95 000 UZS</div>
            </div>
            <button class="star-buy-button" onclick="buyStarTier(500, 95000, this)">Sotib olish</button>
        </div>

        <!-- 1000 Stars -->
        <div class="star-2x2-card">
            <div class="discount-pill">-15%</div>
            <div>
                <div class="star-quantity-row">
                    <span>1 000</span>
                    <img src="images/star.webp" alt="Stars" class="star-badge-icon">
                </div>
                <div class="star-price-row">190 000 UZS</div>
            </div>
            <button class="star-buy-button" onclick="buyStarTier(1000, 190000, this)">Sotib olish</button>
        </div>
    </div>

    <!-- Recipient Input -->
    <div class="recipient-dark-bar">
        <input type="text" id="username" class="recipient-dark-input" placeholder="@username">
        <button class="for-me-pill" onclick="setMyUsername()">O'zimga</button>
    </div>

    <!-- Floating Minimal Dock Navigation -->
    <div class="bottom-dock-nav">
        <div class="dock-tab-btn" onclick="window.location.href='index.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Asosiy</span>
        </div>
        <div class="dock-tab-btn" onclick="window.location.href='gift.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line></svg>
            <span>Gift</span>
        </div>
        <div class="dock-tab-btn" onclick="window.location.href='rating.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.45 1-1 1H7v4h10v-4h-2c-.55 0-1-.45-1-1v-2.34"></path><path d="M18 4H6v7a6 6 0 0 0 12 0V4z"></path></svg>
            <span>Top</span>
        </div>
        <div class="dock-tab-btn" onclick="window.location.href='profile.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Profil</span>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
        function setMyUsername() {
            const user = tg?.initDataUnsafe?.user;
            const input = document.getElementById('username');
            if (input) {
                if (user && user.username) input.value = '@' + user.username;
                else if (user && user.id) input.value = user.id;
                else input.value = '@men';
            }
        }

        async function buyStarTier(qty, price, btn) {
            let uVal = (document.getElementById('username')?.value || '').trim().replace(/^@/, '');
            if (!uVal) {
                const tgUser = tg?.initDataUnsafe?.user;
                if (tgUser?.username) uVal = tgUser.username;
                else if (tgUser?.id) uVal = String(tgUser.id);
            }

            if (!uVal) {
                if (tg?.showAlert) tg.showAlert('Iltimos, Telegram foydalanuvchi nomini kiriting!');
                else alert('Iltimos, Telegram foydalanuvchi nomini kiriting!');
                return;
            }

            const oldText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '⏳ ...';

            const userId = getUserId();
            const apiBase = getApiBase();

            try {
                const res = await fetch((apiBase ? apiBase : '') + '/api/order/stars', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': tg?.initData || '' },
                    body: JSON.stringify({
                        telegram_id: userId,
                        username: uVal,
                        quantity: qty,
                        amount: price,
                        product_type: 'stars',
                        initData: tg?.initData || ''
                    })
                });

                const data = await res.json();
                if (data && data.ok) {
                    if (tg?.showAlert) tg.showAlert(`✅ ${qty} Stars muvaffaqiyatli xarid qilindi!`);
                    else alert(`✅ ${qty} Stars muvaffaqiyatli xarid qilindi!`);
                    setTimeout(() => window.location.href = 'orders.html', 1000);
                } else {
                    const err = data?.error || 'Xaridda xatolik yuz berdi.';
                    if (tg?.showAlert) tg.showAlert(err);
                    else alert(err);
                }
            } catch (err) {
                if (tg?.showAlert) tg.showAlert('Serverga ulanishda xatolik: ' + err.message);
                else alert('Serverga ulanishda xatolik: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = oldText;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            setMyUsername();
            loadUserBalance();
        });
    </script>
</body>

</html>
