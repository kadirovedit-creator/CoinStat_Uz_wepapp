<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StarPayUz - Stars</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>window.API_BASE = 'https://witty-planes-admire.loca.lt';</script>
    <link rel="stylesheet" href="css/style.css?v=10.0">
    <style>
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .header-left__image {
            width: 44px;
            height: 44px;
            border-radius: 12px;
        }

        .balance-badge {
            color: #ffffff;
            font-weight: 700;
            border: 1px solid rgba(56, 189, 248, 0.3);
            background: rgba(13, 19, 34, 0.8);
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }

        .page-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .page-title img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .page-title h2 {
            color: var(--text-main);
            font-size: 20px;
            font-weight: 800;
        }

        .section-label {
            display: block;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .price-hint {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent-sky);
            font-size: 15px;
            font-weight: 800;
            pointer-events: none;
            white-space: nowrap;
        }

        .buttons-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-top: 10px;
            margin-bottom: 24px;
        }

        .amount-btn {
            background: rgba(13, 19, 34, 0.8);
            border: 1px solid var(--border-card);
            border-radius: 14px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            padding: 12px 0;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .amount-btn.selected {
            background: #ffffff !important;
            color: #000000 !important;
            border-color: #ffffff !important;
            box-shadow: 0 4px 14px rgba(255, 255, 255, 0.25) !important;
        }

        .amount-hint {
            color: var(--text-sub);
            font-size: 12px;
            margin: -8px 0 14px 4px;
        }
    </style>
</head>

<body>

    <!-- Loader -->
    <div class="loader-overlay" id="loaderOverlay">
        <div class="loader-star">
            <div class="loader-ring"></div>
            <div class="loader-ring"></div>
            <div class="loader-ring"></div>
            <img src="./images/loader.webp" alt="Loader">
        </div>
        <div class="loader-text">CoinStat UZ</div>
        <div class="loader-sub" data-i18n="loader.sub">Yuklanmoqda...</div>
    </div>

    <!-- Top Profile Header Bar (Horizontal Left-Aligned Layout matching reference screenshot) -->
    <div class="top-header-bar">
        <div class="top-header-left">
            <div class="user-avatar-wrap">
                <img src="" id="avatarImg" style="display:none;" alt="Avatar">
                <span class="user-avatar-initial" id="avatarPlaceholder">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                        <polyline points="17 6 23 6 23 12"></polyline>
                    </svg>
                </span>
            </div>
            <div class="user-meta-col">
                <div class="user-title-name" id="profileName">CoinStat UZ</div>
                <div class="user-id-row" onclick="copyUserId()" title="Nusxalash">
                    <span id="profileUserId">ID: —</span>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                </div>
            </div>
        </div>

        <button class="lang-pill-btn" onclick="toggleLanguage()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
            <span data-i18n-lang="profile.lang_">Русский</span>
            <span style="opacity:0.6; font-size:10px;">v</span>
        </button>
    </div>

    <!-- Hero Balans Card (Blue Radar Style) -->
    <div class="hero-balance-card" onclick="window.location.href='topup.html'">
        <div class="balance-card-label">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
            <span>JORIY BALANS</span>
        </div>
        <div class="balance-card-amount">
            <span id="balance">0</span> <small>UZS</small>
        </div>
        <div class="balance-card-actions">
            <button class="balance-topup-btn" onclick="event.stopPropagation(); window.location.href='topup.html'">
                <span>+</span>
                <span>To'ldirish</span>
            </button>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs-container">
        <div class="tabs">
            <button class="tab active" onclick="openStars()" data-i18n="stars.tab">Stars olish</button>
            <button class="tab" onclick="openPremium()" data-i18n="premium.tab">Premium olish</button>
        </div>
    </div>

    <!-- Content -->
    <div class="content">
        <div class="page-title">
            <img src="./images/star.webp" alt="Star">
            <h2 data-i18n="stars.title">Telegram Stars sotib olish</h2>
        </div>

        <!-- Username Input -->
        <h3 class="section-label" data-i18n="common.recipient">Qabul qiluvchi</h3>
        <div class="input-wrapper">
            <img src="./images/user.webp" class="inside-icon" alt="User">
            <input type="text" id="username" data-i18n-placeholder="common.enter_username" placeholder="Username kiriting" class="input">
        </div>

        <!-- Amount Selection -->
        <h3 class="section-label" data-i18n="stars.amount">Stars miqdori</h3>
        <div class="input-wrapper custom-stars">
            <img src="./images/star-input.webp" class="inside-icon" alt="star">
            <input type="number" id="customStars" class="input" placeholder="50 — 1 000 000" min="50" max="1000000" step="1">
            <span class="price-hint" id="priceHint">0 so'm</span>
        </div>
        <p class="amount-hint" data-i18n="stars.hint" data-i18n-args='{"min":50,"max":1000000}'>Minimal: 50 · Maksimal: 1 000 000 stars</p>

        <div class="buttons-row">
            <button type="button" class="amount-btn" onclick="selectAmount(50, 10000, this)">50</button>
            <button type="button" class="amount-btn" onclick="selectAmount(75, 15000, this)">75</button>
            <button type="button" class="amount-btn" onclick="selectAmount(100, 20000, this)">100</button>
            <button type="button" class="amount-btn" onclick="selectAmount(250, 50000, this)">250</button>
            <button type="button" class="amount-btn" onclick="selectAmount(500, 100000, this)">500</button>
        </div>
    </div>

    <div class="purchase-bar">
        <button type="button" class="btn-primary" id="buyBtn">Sotib olish</button>
    </div>

    <!-- Floating Glass Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="openHome()">
            <div class="nav-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            </div>
            <div class="nav-label">Asosiy</div>
        </div>

        <div class="nav-item" onclick="openGifts()">
            <div class="nav-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line></svg>
            </div>
            <div class="nav-label">Gift</div>
        </div>

        <div class="nav-item" onclick="openReyting()">
            <div class="nav-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.45 1-1 1H7v4h10v-4h-2c-.55 0-1-.45-1-1v-2.34"></path><path d="M18 4H6v7a6 6 0 0 0 12 0V4z"></path></svg>
            </div>
            <div class="nav-label">Top</div>
        </div>

        <div class="nav-item" onclick="openProfile()">
            <div class="nav-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
            <div class="nav-label">Profil</div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
        let selectedStars = 0;
        let selectedPrice = 0;

        function updatePriceHint(stars) {
            const hint = document.getElementById('priceHint');
            if (stars > 0) {
                const price = stars * 200;
                hint.textContent = price.toLocaleString('uz-UZ') + " so'm";
            } else {
                hint.textContent = '0 so\'m';
            }
        }

        document.getElementById('customStars').addEventListener('input', function () {
            document.querySelectorAll('.amount-btn').forEach(btn => btn.classList.remove('selected'));
            const check = validateStarsAmount(this.value);
            if (check.ok) {
                selectedStars = check.value;
                selectedPrice = 0;
            } else {
                selectedStars = 0;
                selectedPrice = 0;
            }
            updatePriceHint(selectedStars);
        });

        function selectAmount(stars, price, btn) {
            const check = validateStarsAmount(stars);
            if (!check.ok) {
                tg.showAlert(check.message);
                return;
            }
            selectedStars = check.value;
            selectedPrice = price;

            document.getElementById('customStars').value = stars;
            document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('selected'));
            if (btn) btn.classList.add('selected');
            updatePriceHint(selectedStars);
        }

        document.addEventListener('DOMContentLoaded', function () {
            const defaultBtn = document.querySelector('.amount-btn');
            if (defaultBtn) {
                selectAmount(50, 10000, defaultBtn);
            }
            setupPurchaseButton(buyStars, 'Sotib olish');
        });

        function setMyUsername() {
            const initData = tg.initDataUnsafe;
            if (initData.user && initData.user.username) {
                document.getElementById('username').value = '@' + initData.user.username;
                tg.showPopup({
                    title: '✅ Tasdiqlandi',
                    message: 'Sizning username o\'rnatildi',
                    buttons: [{ type: 'ok' }]
                });
            } else {
                tg.showAlert('Username topilmadi');
            }
        }

        function buyStars() {
            const customVal = document.getElementById('customStars').value;
            const check = validateStarsAmount(customVal || selectedStars);
            if (!check.ok) {
                tg.showAlert(check.message);
                return;
            }
            selectedStars = check.value;

            const username = getUsername('username');
            if (!username) {
                tg.showAlert('Iltimos, username kiriting!');
                return;
            }

            submitOrder({
                action: 'buy_stars',
                amount: selectedStars,
                price: selectedPrice,
                username: username
            });
        }

        function openHome() {
            window.location.href = 'index.html';
        }

        function openStars() {
            window.location.href = 'stars.html';
        }

        function openPremium() {
            window.location.href = 'premium.html';
        }

        function openGifts() {
            window.location.href = 'gift.html';
        }

        function openReyting() {
            window.location.href = 'rating.html';
        }

        function openProfile() {
            window.location.href = 'profile.html';
        }
    </script>
</body>

</html>
