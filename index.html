<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoinStat UZ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css?v=12.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            padding: 16px;
            padding-bottom: 110px;
            min-height: 100vh;
        }

        /* Top Header Bar */
        .top-user-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            padding: 4px 0;
        }

        .user-left-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #141418;
            border: 1px solid #222228;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .user-avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .user-names-col {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .user-display-name {
            font-size: 16px;
            font-weight: 800;
            color: #ffffff;
        }

        .user-handle-name {
            font-size: 13px;
            font-weight: 600;
            color: #71717a;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .lang-badge-pill {
            background: #141418;
            border: 1px solid #222228;
            color: #a1a1aa;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Luxury Black VIP Bank Card */
        .luxury-bank-card {
            background: linear-gradient(135deg, #181920 0%, #0d0e12 50%, #14151b 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 22px 20px 18px 20px;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.65), inset 0 1px 2px rgba(255, 255, 255, 0.15);
        }

        /* Abstract Luxury Background Mesh & Glow */
        .card-bg-mesh {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .card-bg-mesh svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-content-layer {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Card Top Bar: Chip + NFC + Brand */
        .card-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-chip-nfc-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .emv-chip {
            width: 36px;
            height: 27px;
            background: linear-gradient(135deg, #fef08a 0%, #f59e0b 50%, #b45309 100%);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(245, 158, 11, 0.6);
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.5), 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        .emv-chip::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(0, 0, 0, 0.35);
        }

        .emv-chip::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 1px;
            background: rgba(0, 0, 0, 0.35);
        }

        .chip-inner-core {
            position: absolute;
            top: 6px;
            bottom: 6px;
            left: 8px;
            right: 8px;
            border: 1px solid rgba(0, 0, 0, 0.3);
            border-radius: 3px;
        }

        .nfc-wave-icon {
            width: 20px;
            height: 20px;
            color: rgba(255, 255, 255, 0.6);
        }

        .card-brand-badge {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-brand-title {
            font-size: 13px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1.5px;
        }

        .card-vip-pill {
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.4);
            color: #f59e0b;
            font-size: 9px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 6px;
            letter-spacing: 1px;
        }

        /* Card Balance Center */
        .card-balance-section {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .card-balance-label {
            font-size: 10px;
            font-weight: 700;
            color: #71717a;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .card-balance-amount {
            font-size: 32px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.5px;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .card-currency-symbol {
            font-size: 16px;
            font-weight: 800;
            color: #f59e0b;
        }

        .card-number-mask {
            font-family: 'Space Grotesk', monospace, sans-serif;
            font-size: 12px;
            font-weight: 600;
            color: #52525b;
            letter-spacing: 2.5px;
            margin-top: 2px;
        }

        /* Card Bottom Row */
        .card-bottom-row {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            padding-top: 4px;
        }

        .card-holder-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .card-holder-label {
            font-size: 9px;
            font-weight: 700;
            color: #71717a;
            letter-spacing: 1px;
        }

        .card-holder-name {
            font-size: 12px;
            font-weight: 800;
            color: #e4e4e7;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            max-width: 150px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-topup-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 12px;
            padding: 9px 16px;
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
        }

        .card-topup-btn:active {
            transform: scale(0.96);
            background: #e4e4e7;
        }

        /* 3-Column Stats Grid */
        .stats-tri-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .stat-card-box {
            background: #121316;
            border: 1px solid #222328;
            border-radius: 20px;
            padding: 14px 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .stat-label-text {
            font-size: 11px;
            font-weight: 600;
            color: #71717a;
        }

        .stat-value-text {
            font-size: 18px;
            font-weight: 800;
            color: #ffffff;
        }

        .stat-unit-text {
            font-size: 10px;
            font-weight: 700;
            color: #71717a;
        }

        /* 4 Services Grid (2x2) */
        .services-quad-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .service-quad-card {
            background: #121316;
            border: 1px solid #222328;
            border-radius: 22px;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
        }

        .service-quad-card:hover {
            border-color: #3f3f46;
            background: #18191e;
        }

        .service-quad-card:active {
            transform: scale(0.97);
        }

        .service-icon-wrap {
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .service-icon-wrap img {
            width: 38px;
            height: 38px;
            object-fit: contain;
        }

        .service-card-title {
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
        }

        /* Bottom Minimal Dock Navigation */
        .bottom-dock-nav {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: rgba(18, 19, 22, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            backdrop-filter: blur(20px);
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .dock-tab-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 14px;
            border-radius: 18px;
            color: #71717a;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .dock-tab-btn.active {
            color: #ffffff;
        }

        .dock-tab-btn:active {
            transform: scale(0.9);
        }
    </style>
</head>

<body>

    <!-- User Header -->
    <div class="top-user-header">
        <div class="user-left-info">
            <div class="user-avatar-circle">
                <img src="./images/logo.png" id="avatarImg" alt="CoinStat">
            </div>
            <div class="user-names-col">
                <div class="user-display-name" id="profileName">username</div>
                <div class="user-handle-name" onclick="copyUserId()">
                    <span id="profileUserId">@coinuser</span>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                </div>
            </div>
        </div>
        <button class="lang-badge-pill" onclick="toggleLanguage()" id="langBtn">uz</button>
    </div>

    <!-- Luxury Black VIP Bank Card -->
    <div class="luxury-bank-card">
        <!-- Abstract Luxury Background Contour Curves & Radial Ambient Glow -->
        <div class="card-bg-mesh">
            <svg viewBox="0 0 360 190" fill="none" preserveAspectRatio="none">
                <!-- Glowing Ambient Circles -->
                <circle cx="330" cy="30" r="110" stroke="url(#cardMeshGrad1)" stroke-width="1.2" opacity="0.35" />
                <circle cx="330" cy="30" r="150" stroke="url(#cardMeshGrad1)" stroke-width="1" opacity="0.2" stroke-dasharray="6 6" />
                <circle cx="330" cy="30" r="190" stroke="url(#cardMeshGrad1)" stroke-width="0.8" opacity="0.1" />
                
                <!-- Modern Flowing Luxury Contour Lines -->
                <path d="M-20 160 C 90 90, 180 200, 380 110" stroke="url(#cardMeshGrad2)" stroke-width="1.5" opacity="0.25" />
                <path d="M-30 180 C 110 120, 210 220, 390 130" stroke="url(#cardMeshGrad2)" stroke-width="1" opacity="0.15" />
                
                <defs>
                    <linearGradient id="cardMeshGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#f59e0b" />
                        <stop offset="100%" stop-color="#3b82f6" />
                    </linearGradient>
                    <linearGradient id="cardMeshGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ffffff" />
                        <stop offset="50%" stop-color="#f59e0b" />
                        <stop offset="100%" stop-color="#10b981" />
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <div class="card-content-layer">
            <!-- Card Top Bar: Chip + NFC + Brand -->
            <div class="card-top-bar">
                <div class="card-chip-nfc-group">
                    <!-- Gold EMV Chip -->
                    <div class="emv-chip">
                        <div class="chip-inner-core"></div>
                    </div>
                    <!-- Contactless Waves -->
                    <svg class="nfc-wave-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                        <path d="M8.5 16.5a5 5 0 0 1 0-9" />
                        <path d="M12 19a8.5 8.5 0 0 0 0-14" />
                        <path d="M15.5 21.5a12 12 0 0 0 0-19" />
                    </svg>
                </div>
                <div class="card-brand-badge">
                    <span class="card-brand-title">COINSTAT</span>
                    <span class="card-vip-pill">BLACK</span>
                </div>
            </div>

            <!-- Card Middle: Balance Details -->
            <div class="card-balance-section">
                <div class="card-balance-label">ASOSIY BALANS</div>
                <div class="card-balance-amount">
                    <span id="balance">0</span> <span class="card-currency-symbol">UZS</span>
                </div>
                <div class="card-number-mask">
                    <span>••••</span> <span>••••</span> <span>••••</span> <span id="cardMaskUid">0000</span>
                </div>
            </div>

            <!-- Card Bottom Row: Cardholder & Topup Action -->
            <div class="card-bottom-row">
                <div class="card-holder-group">
                    <div class="card-holder-label">KARTA EGASI</div>
                    <div class="card-holder-name" id="cardHolderName">VIP FOYDALANUVCHI</div>
                </div>
                <button type="button" class="card-topup-btn" onclick="window.location.href='topup.html'">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>To'ldirish</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 3-Column Stats Grid -->
    <div class="stats-tri-grid">
        <div class="stat-card-box" onclick="window.location.href='orders.html'" style="cursor: pointer;">
            <div class="stat-label-text">Buyurtmalar</div>
            <div class="stat-value-text" id="ordersCount">0</div>
        </div>
        <div class="stat-card-box">
            <div class="stat-label-text">Sarflangan</div>
            <div class="stat-value-text" id="totalSpent">0</div>
            <div class="stat-unit-text">UZS</div>
        </div>
        <div class="stat-card-box">
            <div class="stat-label-text">Balans</div>
            <div class="stat-value-text" id="userBalanceStat">0</div>
            <div class="stat-unit-text">UZS</div>
        </div>
    </div>

    <!-- 4 Services Grid (2x2) -->
    <div class="services-quad-grid">
        <!-- Stars -->
        <div class="service-quad-card" onclick="window.location.href='stars.html'">
            <div class="service-icon-wrap">
                <img src="./images/star.webp" alt="Stars">
            </div>
            <div class="service-card-title">Stars</div>
        </div>

        <!-- Premium -->
        <div class="service-quad-card" onclick="window.location.href='premium.html'">
            <div class="service-icon-wrap">
                <img src="./images/premium.webp" alt="Premium">
            </div>
            <div class="service-card-title">Premium</div>
        </div>

        <!-- Sovg'alar -->
        <div class="service-quad-card" onclick="window.location.href='gift.html'">
            <div class="service-icon-wrap">
                <img src="./images/gift.webp" alt="Sovg'alar">
            </div>
            <div class="service-card-title">Sovg'alar</div>
        </div>

        <!-- Virtual Nomer -->
        <div class="service-quad-card" onclick="window.location.href='phone.html'">
            <div class="service-icon-wrap">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                    <line x1="12" y1="18" x2="12.01" y2="18"></line>
                </svg>
            </div>
            <div class="service-card-title">Virtual Nomer</div>
        </div>
    </div>

    <!-- Floating Minimal Dock Navigation -->
    <div class="bottom-dock-nav">
        <div class="dock-tab-btn active" onclick="window.location.href='index.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Asosiy</span>
        </div>
        <div class="dock-tab-btn" onclick="window.location.href='gift.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line></svg>
            <span>Gift</span>
        </div>
        <div class="dock-tab-btn" onclick="window.location.href='rating.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.45 1-1 1H7v4h10v-4h-2c-.55 0-1-.45-1-1v-2.34"></path><path d="M18 4H6v7a6 6 0 0 0 12 0V4z"></path></svg>
            <span>Top</span>
        </div>
        <div class="dock-tab-btn" onclick="window.location.href='profile.html'">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Profil</span>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadUserBalance();
            fetchTransactions();

            const userId = String(getUserId() || '');
            if (userId) {
                const maskEl = document.getElementById('cardMaskUid');
                if (maskEl) maskEl.textContent = userId.slice(-4) || '0000';
            }

            const holderEl = document.getElementById('cardHolderName');
            if (holderEl && tg.initDataUnsafe?.user) {
                const u = tg.initDataUnsafe.user;
                holderEl.textContent = u.username ? ('@' + u.username) : (((u.first_name || '') + ' ' + (u.last_name || '')).trim() || 'VIP FOYDALANUVCHI');
            }
        });

        async function fetchTransactions() {
            const userId = getUserId();
            const apiBase = getApiBase();
            if (!userId) return;

            try {
                const res = await fetch((apiBase ? apiBase : '') + '/api/user/transactions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': tg.initData || '' },
                    body: JSON.stringify({ telegram_id: userId, initData: tg.initData || '' })
                });
                const data = await res.json();
                if (data && data.ok) {
                    const cnt = document.getElementById('ordersCount');
                    const spent = document.getElementById('totalSpent');

                    // Filter only real purchase orders (exclude any topup and deposits)
                    const purchaseOrders = (data.orders || []).filter(o => {
                        const pt = String(o.product_type || o.type || '').toLowerCase();
                        return !pt.startsWith('topup') && 
                               pt !== 'deposit' && 
                               pt !== 'balance' &&
                               o.status !== 'cancelled' &&
                               o.status !== 'failed' &&
                               o.status !== 'rejected';
                    });

                    const ordersCount = (typeof data.orders_count === 'number') ? data.orders_count : purchaseOrders.length;
                    if (cnt) cnt.textContent = String(ordersCount);

                    let totalSpent = 0;
                    if (typeof data.total_spent === 'number') {
                        totalSpent = data.total_spent;
                    } else {
                        purchaseOrders.forEach(o => {
                            if (o.status === 'completed' || o.status === 'paid') {
                                totalSpent += Number(o.amount || 0);
                            }
                        });
                    }

                    if (spent) {
                        if (totalSpent >= 1000000) {
                            spent.textContent = (totalSpent / 1000000).toFixed(1) + 'M';
                        } else if (totalSpent >= 1000) {
                            spent.textContent = (totalSpent / 1000).toFixed(0) + 'k';
                        } else {
                            spent.textContent = totalSpent.toLocaleString('uz-UZ');
                        }
                    }
                }
            } catch (e) {}
        }
    </script>
</body>

</html>
